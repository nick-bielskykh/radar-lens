 ON1 Plus і які фічі просуває: автомаски (аналог Mask AI), апскейл до 8x (Upscale AI), домальовування хмар (Sky AI/Atmosphere AI) і плівкові оверлеї (Film Grain, пресети). Для Luminar Neo — підказка щодо форматів навчального контенту й пакування розширень.", "importance": 2, "category": "comp", "media": {"kind": "gallery", "hero_image": 0, "video": null}, "page": {"images": [{"uri": "/img/10a036c7d216.jpg", "w": 1000, "h": 562, "alt": "Cloud Shapes panel in ON1 Photo RAW 2026 with Color Droppers sampling sky tones over a mountain landscape"}, {"uri": "/img/a9d6096df1ec.jpg", "w": 1000, "h": 562, "alt": ""}, {"uri": "/img/d7de65e3faff.jpg", "w": 1000, "h": 567, "alt": "Film Vault Overlays light leak effect applied to a row of palm trees against a blue sky"}, {"uri": "/img/37c1feb87647.jpg", "w": 1000, "h": 1249, "alt": "ON1 Plus Camera Profiles eBook cover"}], "videos": []}}, {"id": "39c450020f", "source": "TechJuice", "url": "https://www.techjuice.pk/snapseed-4-android-update-google/", "date": "2026-09-03T11:04:21+00:00", "title": "Snapseed 4.0 для Android: Smart Masking, batch-редагування та плівкова камера", "lead": "Google випустила Snapseed 4.0 для Android — першу велику версію майже за два роки — з розумними масками, batch-редагуванням і вбудованою камерою; застосунок лишається повністю безкоштовним.", "full": ["Smart Masking виділяє обʼєкт або фон одним дотиком без ручного пензля, Batch Editing застосовує збережені луки й окремі корекції одразу до кількох фото. Android раніше сидів на версії 2.22 (2024), тоді як iOS отримала 3.0 у червні 2025-го. Snapseed Camera знімає з емуляціями Kodak Portra, Fujifilm Superia, Polaroid SX-70 та Ilford HP5 у реальному часі, ефекти лишаються оборотними після зйомки; є Pro-режим з ISO, витримкою та фокусом.", "Інтерфейс перероблено: домашня сітка з попередніми правками, оновлений набір інструментів з меншою кількістю дотиків, необмежена кількість закріплених інструментів замість чотирьох. Нові інструменти — Color HSL, Dehaze, Halation і Bloom, разом понад 30 інструментів (Healing, Selective, Lens Blur, Curves, Double Exposure). Редагування недеструктивне.", "Поетапне розгортання почалося 8 травня, iOS одночасно отримала 4.0 з новим інтерфейсом, Halation і Bloom. Snapseed лишається без підписки, водяних знаків і покупок — на тлі того, що майже всі здібні мобільні редактори перейшли на підписку."], "means": "Безкоштовний tier-1 редактор Google на Android тепер має автомаски (аналог Mask AI), батч-обробку та Dehaze — те, чого нашій слабшій Android-версії Luminar Mobile бракує найбільше. Halation/Bloom і плівкові емуляції перетинаються з нашими пресетами і Film Grain. Потрібно переоцінити ціннісну пропозицію підписки Luminar Mobile на Android: наш аргумент — хмарні Sky, Erase, Relight і Portrait, яких у Snapseed немає.", "importance": 4, "category": "comp", "media": {"kind": "image", "hero_image": 0, "video": null}, "page": {"images": [{"uri": "/img/64ddb8a03ffa.jpg", "w": 1000, "h": 562, "alt": ""}], "videos": []}}, {"id": "df9552db8c", "source": "Adobe", "url": "https://blog.adobe.com/en/publish/2026/09/02/introducing-adobe-for-slack", "date": "2026-09-03T04:21:10+00:00", "title": "Adobe for Slack: 70+ інструментів Photoshop, Firefly і Lightroom усередині Slackbot", "lead": "Adobe випустила застосунок Adobe for Slack — MCP-інтеграцію, через яку Slackbot викликає понад 70 інструментів Firefly, Express, Photoshop, Lightroom, Acrobat та інших сервісів прямо з чату.", "full": ["Застосунок уже доступний для команд на тарифах Slack Business+ та Enterprise+. Користувач описує потрібний результат Slackbot, а той сам обирає відповідні інструменти Adobe і може підтягувати контекст з розмов, файлів, каналів і Canvas. Почати можна без облікового запису Adobe, а вхід у безкоштовний акаунт відкриває додаткові функції.", "Серед сценаріїв — генерація зображень і відео через Firefly, створення PDF з файлів і таблиць, пошук у бібліотеці Creative Cloud за темою чи настроєм, адаптація креативів під розміри соцмереж і пакетна обробка фото: видалення фону та відволікаючих обʼєктів, корекція світла й тону, кадрування і ресайз наборів знімків (хедшоти, фото з подій, товарні картки).", "Adobe називає це частиною стратегії виносити свої інструменти в AI-чатботи: інтеграції вже є для ChatGPT, Claude і Copilot, Gemini обіцяють незабаром. Для точного піксельного контролю користувача перенаправляють у повноцінні застосунки — Photoshop, Premiere, Firefly."], "means": "Adobe перетворює редагування на агентний сценарій: «видали фон і вирівняй світло на цих 30 фото» виконується без відкриття редактора. Це тисне на цінність наших Erase, Relight AI і пакетних пресетів як окремих кроків у застосунку. Для Luminar Neo варто оцінити MCP-обгортку над хмарними інструментами (GenErase, Sky AI, Enhance) — це дешевий канал дистрибуції в чатботи, який Adobe уже займає.", "importance": 3, "category": "comp", "media": {"kind": "image", "hero_image": 0, "video": null}, "page": {"images": [{"uri": "/img/93622cec9e8f.jpg", "w": 750, "h": 329, "alt": "Adobe for Slack"}, {"uri": "/img/63bb62de198a.jpg", "w": 1000, "h": 438, "alt": ""}, {"uri": "/img/72c3879160f8.jpg", "w": 750, "h": 329, "alt": "Adobe for Slack"}], "videos": []}}, {"id": "9d4c0b5587", "source": "Fstoppers", "url": "https://fstoppers.com/landscapes/lightroom-classic-preset-trick-regenerates-masks-every-photo-904439?utm_source=fstoppers&utm_medium=RSS&utm_campaign=rss_feed_articles", "date": "2026-09-02T13:03:02+00:00", "title": "Lightroom Classic: пресети з AI-масками перегенеровують сегментацію на кожному фото", "lead": "Fstoppers розбирає робочий процес Terry Vander Heiden: у Lightroom Classic AI-маски ландшафту (небо, гори, рослинність, вода, земля) зберігаються в пресет і автоматично перебудовуються під кожен новий знімок.", "full": ["Маски Lightroom, засновані на розпізнаванні сцени, можна запекти у користувацький пресет. Після застосування до нової фотографії програма за секунду-дві генерує маски саме для цього кадру, а не копіює їх із попереднього. Якщо елемент (наприклад, природний ґрунт) не знайдено, маска позначається попередженням і її просто видаляють.", "Автор показує два варіанти: пресет із повним набором правок для серії схожих кадрів і «легкий» пресет, який лише створює маски, залишаючи редагування вручну. Ідея — прогнати всю поїздку через масковий пресет одразу після імпорту, щоб кожен кадр був попередньо сегментований. Також описано швидке створення віртуальних копій, перегляд кліпінгу та чорно-білу конверсію через Color Mixer."], "means": "У Luminar Neo Mask AI вміє те саме розпізнавання (небо, вода, рослинність, людина), але сценарій «маски як частина пресета, що перегенеровуються на кожному фото» — сильний аргумент Lightroom для пакетної роботи. Варто перевірити, чи наші Presets із локальними правками на Mask AI відпрацьовують так само автоматично на новому знімку, і показати це в комунікації.", "importance": 2, "category": "comp", "media": {"kind": "image", "hero_image": 0, "video": null}, "page": {"images": [{"uri": "/img/4b48db421ffe.jpg", "w": 1000, "h": 565, "alt": "Tutorial thumbnail featuring instructor in plaid shirt with landscape photography preset creation interface"}], "videos": []}}, {"id": "6af7286517", "source": "IT Brief UK", "url": "https://itbrief.co.uk/story/photoroom-launches-visual-agents-for-enterprise-catalogues", "date": "2026-09-02T08:46:00+00:00", "title": "Photoroom запускає Visual Agents для каталогів: моделі проходять перевірку лише у 29% випадків", "lead": "Photoroom представив Visual Agents — корпоративну систему, яка автоматизує AI-генерацію товарних фото й відео з перевіркою точності та повторними спробами, і оприлюднив бенчмарк точності моделей редагування.", "full": ["Visual Agents будує пайплайн навколо вхідних каталожних зображень: обирає модель редагування під задачу, порівнює результат з оригіналом товару, повторює невдалі генерації і лише сумнівні випадки віддає людині. Продукт доступний для enterprise-клієнтів з оплатою за обсяг; для суворіших вимог є додаткова гарантія на кейси, які не проходять і після повторів.", "Найцікавіше — бенчмарк: на 4 250 згенерованих зображеннях для 850 реальних товарів (одяг, взуття, сумки, прикраси) найкращі моделі редагування проходили повну перевірку точності лише у 29% випадків, а логотипи спотворювалися в кожному пʼятому результаті. Власний Fidelity Layer Photoroom підняв показник до 38,2%. Інженери помітили, що повторні спроби без зміни моделі помітно покращують результат — звідси retry-цикл.", "Серед ранніх впроваджень: маркетплейс виконав понад 1,5 млн автоматичних перевірок за три тижні і виправив понад 90 тис. зображень; сервіс доставки їжі обробив 8 200 фото за ніч, з них 7 пішли рецензенту. Photoroom заявляє понад 7 млрд оброблених зображень на рік."], "means": "Photoroom (tier-2) рухається в enterprise-автоматизацію, де ми не конкуруємо, але його дані важливі: навіть найкращі моделі інпейнту спотворюють дрібні деталі й текст у більшості випадків. Для GenErase, GenSwap і GenExpand це аргумент за автоматичну перевірку результату й повторну генерацію під капотом, а не лише кнопку «ще варіант». Підхід «модель-роутер + перевірка + retry» можна перенести на наш хмарний пайплайн.", "importance": 3, "category": "comp", "media": {"kind": "none", "hero_image": null, "video": null}, "page": {"images": [{"uri": "/img/f57a93124874.jpg", "w": 1000, "h": 564, "alt": ""}], "videos": []}}, {"id": "1e69c2c6ab", "source": "Yahoo Tech", "url": "https://tech.yahoo.com/cameras/articles/adobe-camera-raw-18-6-230720324.html", "date": "2026-09-01T23:07:20+00:00", "title": "Adobe Camera Raw 18.6: інструмент Glow з дифузією, bloom і галацією для RAW", "lead": "Adobe випустила Camera Raw 18.6 з новим інструментом Glow у панелі Effects: три плівкові стилі свічення — Diffusion, Bloom і Halation — застосовуються до RAW глобально або через маски. Також додано панель метаданих і інструмент Trim.", "full": ["Glow розташований у панелі Effects поруч із Vignette і Grain. Diffusion дає туманне пом'якшення на кшталт фільтрів Black Mist / Pro Mist, Bloom — м'яке свічення лише у світлах (тумани, водоспади), Halation — кольоровий ореол навколо яскравих країв і джерел світла, як на плівці. Є підналаштування Style, Range, Spread і Warmth; вони спільні для всього кадру, а маски (об'єкт, діапазон яскравості, область) керують лише силою ефекту.", "Нова панель Metadata Info показує камеру, об'єктив, розміри, дату, копірайт і Content Credentials прямо в робочому просторі. Інструмент Trim у Crop & Expand робить усе поза кадруванням прозорим (а не прихованим), що спрощує композитинг і працює в парі з Generative Expand на Firefly. Додано профілі нових камер і об'єктивів, зокрема Tamron 12-20mm F2.8 і анаморфних об'єктивів Reeflex для iPhone.", "Оновлення доступне через Creative Cloud. Glow поки що є лише в ACR і відсутній у Lightroom, але оглядачі очікують його появу там пізніше — так само, як раніше з видаленням відблисків."], "means": "Adobe додає плівкові ефекти на рівні RAW, які в Luminar Neo частково покриваються Film Grain, Vignette і Magic Light AI, але окремого дифузійного свічення з керуванням Bloom/Halation і теплотою в нас немає. Це недорогий у реалізації класичний ефект, який добре лягає в Presets і Layers та може працювати з Mask AI для локального застосування. Варто оцінити його і для Luminar Mobile як on-device фільтр.", "importance": 3, "category": "comp", "media": {"kind": "video", "hero_image": 0, "video": "Te1D8Nmal7I"}, "page": {"images": [{"uri": "/img/74ae0a12d984.jpg", "w": 976, "h": 549, "alt": "Traditional Chinese pavilion with curved roof by a river at dusk, surrounded by illuminated modern skyscrapers; digital settings panel overlay visible in the foreground."}, {"uri": "/img/e925960ee803.jpg", "w": 976, "h": 594, "alt": "A screenshot of Adobe Camera Raw 18.6 showing the new Metadata Info Panel on the right. The photo in the viewer is a modern office building with dark glass windows and geometric reflections, featuring the signs \"ROCK POINTE III\" and \"601 WASHINGTON\" on its facade against a blue sky."}], "videos": [{"yt": "Te1D8Nmal7I"}]}}, {"id": "bd711de89b", "source": "jetstream.blog", "url": "https://jetstream.blog/en/android-drop-september-2026/", "date": "2026-09-01T21:21:20+00:00", "title": "Android Drop вересня 2026: AI Enhance і Ask Photos у Google Photos, Nano Banana 2 у Messages", "lead": "Google 1 вересня випустив вересневий Android Drop з 11 функціями. Серед них — AI Enhance в одне натискання та AI-редагування Ask Photos у Google Photos, а також перехід функції Remix у Google Messages на модель Nano Banana 2.", "full": ["AI Enhance у Google Photos аналізує фото й одразу застосовує найефективніші корекції, включно з тонуванням кольору та кадруванням; функція доступна глобально всіма мовами. Ask Photos додає AI-редагування зображень через текстові запити прямо в застосунку Google Photos.", "Remix у Google Messages переходить на генеративну модель Nano Banana 2 з кращим рендерингом тексту та ширшими знаннями про світ — можна створювати запрошення чи постери з друзями, не виходячи з месенджера. Решта функцій дропу не стосуються фото: Find Hub запам'ятовує місця речей, Motion Assist зменшує заколисування на Android 17, у Gemini Live з'являється Guided vision для людей з порушеннями зору, Google Keep інтегрується в Messages."], "means": "AI Enhance у Google Photos — це безкоштовний on-device/хмарний аналог Enhance AI у Luminar Mobile, доступний сотням мільйонів Android-користувачів; це підвищує планку для нашої слабшої Android-версії. Ask Photos з редагуванням за текстом рухає Google Photos у бік розмовного редактора, що перетинається з Erase, Sky і Relight у Mobile. Nano Banana 2 в системних застосунках означає, що генеративна якість Google стає буденною для аудиторії.", "importance": 4, "category": "comp", "media": {"kind": "image", "hero_image": 0, "video": null}, "page": {"images": [{"uri": "/img/1fcb2dfa5f7f.jpg", "w": 1000, "h": 562, "alt": ""}], "videos": []}}, {"id": "cfb11d71f7", "source": "9to5Google", "url": "https://9to5google.com/2026/09/01/google-pics-launch/", "date": "2026-09-01T16:00:00+00:00", "title": "Google Pics вийшов у Workspace: об'єктне AI-редагування на Nano Banana", "lead": "Google запустив Google Pics — редактор і генератор зображень на моделі Nano Banana, вбудований у Google Workspace (Docs, Slides, згодом Drive) і доступний на pics.new. Анонсований на I/O 2026, інструмент з 1 вересня доступний у загальному доступі.", "full": ["Pics пропонує «точне об'єктне редагування»: сегментація дозволяє виділити окремий об'єкт у зображенні й змінити тільки його, залишивши решту недоторканою. Інструкції задаються текстовими коментарями прямо на зображенні, кілька правок можна виконати одночасно й легко відкотити. Окремо редагується і навіть перекладається текст у зображенні зі збереженням дизайну та шрифту; є кадрування під web, соцмережі та друк.", "Редактор відкривається як оверлей при кліку на зображення в Docs або Slides, підтримує імпорт з комп'ютера, Google Drive і Google Photos, спільну роботу за посиланням і генерацію кількох варіантів з одного промпта. Google позиціонує продукт для бізнес-задач: локалізація соцмережевих і рекламних матеріалів, розміщення продуктів у різних контекстах, флаєри та мерч.", "Доступність: тарифи Workspace Business Standard, Business Plus, Enterprise Standard і Enterprise Plus з 1 вересня, а також підписники Google AI Pro та Ultra протягом найближчих тижнів. Оглядачі порівнюють Pics із Canva й Adobe Express і зауважують, що це інструмент «промпт замість дизайну», а не покращення Google Photos."], "means": "Google робить Nano Banana масовим інструментом об'єктного редагування з мультиредагуванням і сегментацією — це прямий аналог зв'язки Mask AI + GenSwap/GenErase у Luminar Neo, але з текстовим керуванням. Для Luminar Mobile важливо, що імпорт іде прямо з Google Photos і що рівень «виділив об'єкт — описав правку» стає базовим очікуванням користувача. Варто відстежувати ліміти генерацій і розширення Pics на Google Photos.", "importance": 4, "category": "comp", "media": {"kind": "video", "hero_image": 0, "video": "1LYsbVfwgzA"}, "page": {"images": [{"uri": "/img/d038b7cbc3c9.jpg", "w": 1000, "h": 562, "alt": ""}, {"uri": "/img/6ed15d7ea5b5.jpg", "w": 1000, "h": 523, "alt": ""}], "videos": [{"yt": "1LYsbVfwgzA"}]}}, {"id": "90841e6fe8", "source": "آي-فون إسلام", "url": "https://iphoneislam.com/language/en/2026/07/our-experience-with-the-clean-up-tool-in-the-ios-27-beta-apples-ai-photo-editing-is-finally-worth-using-but/169466", "date": "2026-09-01T15:27:50+00:00", "title": "Clean Up в iOS 27 beta: швидше, точніше, з режимами Fast і High Quality", "lead": "У developer beta iOS 27 інструмент Clean Up у Photos отримав помітно кращий генеративний заповнювач і два режими роботи — Fast і High Quality. Оглядачі iPhone Islam кажуть, що видалення об'єктів нарешті придатне для щоденного використання.", "full": ["За тестами, Clean Up став швидше й точніше розпізнавати елементи для видалення, краще працює зі світлом і тінями. Порівняно з iOS 26, де на місці видалених об'єктів залишалися розмиті плями й нерівномірні кольори, у iOS 27 алгоритм реконструює фон, розуміючи його загальний патерн, і результат виглядає природно.", "Нова опція — вибір між режимом Fast (правка за долі секунди для швидкого шерингу) та High Quality (довша, але точніша попіксельна обробка для друку). Автори зазначають, що на етапі бети є «серйозна перешкода» щодо продуктивності й сумісності пристроїв, яка може стримувати повне використання інструмента."], "means": "Apple підтягує вбудований Clean Up до рівня, який раніше був перевагою окремих редакторів, — це прямий тиск на Erase у Luminar Mobile для iOS, де користувач тепер має безкоштовний on-device варіант із режимом високої якості. Нам варто чітко відрізнятися якістю на складних фонах і генеративним GenErase, а також розглянути аналогічний вибір «швидко/якісно» як UX-патерн для хмарної обробки.", "importance": 3, "category": "comp", "media": {"kind": "gallery", "hero_image": 0, "video": null}, "page": {"images": [{"uri": "/img/28558633cfcf.jpg", "w": 1000, "h": 563, "alt": "Testing the Clean Up tool in iOS 27"}, {"uri": "/img/7568d042c2bd.jpg", "w": 1000, "h": 562, "alt": ""}, {"uri": "/img/325bcb906b74.jpg", "w": 768, "h": 384, "alt": "From the Phonegram website: In the first image, a man is shown outdoors holding a card to his eye; in the next two images, face distortion effects have been applied using iOS 27 and iOS 26, highlighting the improved capabilities of the 'Clean Up' tool in iOS 27 for creative photo editing."}, {"uri": "/img/f60488c977ec.jpg", "w": 768, "h": 512, "alt": "From the Phonegram website: Three side-by-side images show a hand holding an orange phone, a distorted hand, and an empty hand; with labels 'Original Image', 'iOS 26', and 'iOS 27' under the heading 'Clean Up Tool'. The last image highlights how the Clean Up tool in iOS 27 provides more accurate results when removing elements from photos."}, {"uri": "/img/3933df29deac.jpg", "w": 1000, "h": 562, "alt": "From the Phonegram website: A hand holding two smartphones displaying photos of the same man; one photo shows him wearing sunglasses, and the other without, highlighting the stunning results achieved using the Clean Up tool in iOS 27."}], "videos": []}}, {"id": "f49774b943", "source": "Fstoppers", "url": "https://fstoppers.com/apps/dxo-releases-photolab-10-depth-masks-advanced-color-grading-and-new-ai-tools-904420", "date": "2026-09-01T13:03:01+00:00", "title": "DxO PhotoLab 10: маски глибини, сегментація обличчя, кольорове колесо та зв'язка з Affinity", "lead": "DxO випустила PhotoLab 10 з новими Depth Masks на основі AI-карти глибини, сегментацією облич, масками для кожної людини окремо, єдиним колесом колорграду та кнопкою передачі зображення в Affinity. Довічна ліцензія коштує $249.99, апгрейд з версій 8–9 — $129.99.", "full": ["Depth Masks будують карту глибини з будь-якого файлу без вбудованих даних глибини й дозволяють локально редагувати передній, середній або задній план; межі уточнюються повзунками й розтушовкою. AI Masks тепер розпізнають кожну людину окремо (спільна маска, група або індивідуальні маски), а сегментація обличчя додає брови, очі, райдужку і зіницю, склеру, зуби, волосся на обличчі, шкіру та губи до наявних категорій (небо, суб'єкт, фон, тварини, квіти, транспорт). AI-маски можна уточнювати піпеткою U Point за кольором і яскравістю.", "Новий інструмент Color Grading зібраний навколо одного колеса з незалежним керуванням тінями, середніми тонами, світлами й балансом; правки можна зв'язувати між тональними діапазонами. Додано Control Brush, еліптичні контрольні точки, автоматичне видалення сенсорного пилу на рівні RAW, кадрування «як знято», покращення бібліотеки. Оновлення шумозаглушення немає — використовується той самий DeepPRIME, що й у PureRAW 6. Генеративних функцій, заміни неба чи генеративного видалення в PhotoLab, як і раніше, немає.", "Кнопка Affinity відкриває зображення для попіксельної ретуші й композитингу з поверненням результату в PhotoLab — DxO називає це першим кроком інтеграції. Оглядачі підкреслюють, що зв'язка DxO + Affinity утворює повний RAW-to-pixel робочий процес без підписки, а Fstoppers окремо порівнює Depth Masks із «регулюванням світла за глибиною» в Luminar Neo, відзначаючи більшу гнучкість DxO. Доступна 7-денна пробна версія."], "means": "DxO виходить на нашу територію: Depth Masks за AI-картою глибини прямо конкурують із Relight AI і Bokeh AI, а посегментна маска обличчя (райдужка, склера, зуби, губи) деталізованіша за наші Face AI/Skin AI та Mask AI. Водночас у PhotoLab немає Sky AI, GenErase та інших генеративних інструментів — це наша перевага в позиціюванні. Зв'язка «довічна ліцензія + Affinity» цілить у ту ж аудиторію, що тримає Luminar другим редактором поруч із Lightroom.", "importance": 4, "category": "comp", "media": {"kind": "gallery", "hero_image": 0, "video": null}, "page": {"images": [{"uri": "/img/2f7f791a5416.jpg", "w": 1000, "h": 565, "alt": "Screenshot of DxO photo editing software displaying a desert landscape at sunset"}, {"uri": "/img/f3812075d32f.jpg", "w": 960, "h": 900, "alt": "Before and after color grading comparison of male portrait with warm skin tones"}, {"uri": "/img/99f3721fa237.jpg", "w": 993, "h": 665, "alt": "Screenshot showing a custom mask creator interface overlaid on a beach photo of two women in water and a green-screen figure."}, {"uri": "/img/d19868cebbf4.jpg", "w": 1000, "h": 596, "alt": "Woman with black blunt bangs and closed eyes wearing bright green lipstick against pink background"}, {"uri": "/img/6d3613cf8415.jpg", "w": 1000, "h": 564, "alt": "Illustration of a bright green and white striped zebra against a blurred natural background"}, {"uri": "/img/d149d3651220.jpg", "w": 960, "h": 900, "alt": "Screenshot showing before and after comparison of cityscape photo editing with spot removal and desaturation controls"}, {"uri": "/img/588254ab0a80.jpg", "w": 1000, "h": 542, "alt": "Screenshot of Local Adjustments panel in photo editing software with red rock formations at sunset"}], "videos": []}}, {"id": "740adb9e4f", "source": "Notebookcheck", "url": "https://www.notebookcheck.net/New-free-open-source-video-editor-update-brings-offline-AI-subject-masking-and-pro-color-scopes.1383937.0.html", "date": "2026-08-31T13:37:00+00:00", "title": "OpenShot 4.0: офлайн AI-маскування об'єктів на YOLO, EfficientSAM і Cutie", "lead": "Вийшов безкоштовний відеоредактор OpenShot 4.0 (GPLv3) для Windows, macOS і Linux. Серед нових ефектів — Object Mask, що будує анімовану маску навколо об'єкта за кількома точками повністю локально, без хмари й акаунта.", "full": ["Object Mask використовує мережі YOLO, EfficientSAM і Cutie, конвертовані в ONNX і завантажувані за потреби; користувач ставить кілька позитивних і негативних точок, а маска трекається по кадрах. Уся обробка відбувається на пристрої. Серед десяти нових ефектів також Denoise Image, Film Grain, Glow, Shadow, Displacement Map і Color Grade.", "Новий Color View об'єднує колірні кола для глобального, тіньового, середнього та світлого діапазонів, чотири криві, підтримку .cube LUT з регулюванням інтенсивності та скопи: waveform, гістограму, RGB parade і vectorscope з лінією шкірних тонів. Таймлайн переписано на нативний Qt, а Recording View дозволяє записувати екран, вебкамеру й мікрофон одразу в проєкт."], "means": "Це референс для Mask AI і Erase: зв'язка EfficientSAM + Cutie в ONNX показує, що інтерактивне маскування за кліками з трекінгом можна робити повністю на пристрої в open-source продукті. Для Luminar Mobile, де Erase і Portrait частково залежать від хмари, EfficientSAM під Core ML/NNAPI — реальний кандидат на локальний вибір об'єкта. GPLv3 не дозволяє брати код напряму, але самі моделі мають окремі ліцензії й їх варто перевірити.", "importance": 3, "category": "ai", "media": {"kind": "image", "hero_image": 0, "video": null}, "page": {"images": [{"uri": "/img/a8e122e26fac.jpg", "w": 1000, "h": 750, "alt": ""}], "videos": []}}, {"id": "217d1c8bcc", "source": "Adobe Newsroom", "url": "https://news.adobe.com/news/2026/08/adobe-mcit-and-humain-expand-partnership", "date": "2026-08-31T08:23:23+00:00", "title": "Adobe дає 27 млн жителів Саудівської Аравії рік безкоштовного Firefly та Express", "lead": "На LEAP 2026 Adobe, MCIT і HUMAIN розширили партнерство: понад 27 млн жителів Саудівської Аравії від 13 років отримають 12 місяців безкоштовного Firefly Standard і Express Premium. Adobe оцінює зобов'язання в понад $4 млрд.", "full": ["Разом із доступом до інструментів HUMAIN і Adobe готують спільну модель генерації зображень на базі Adobe Firefly Foundry, налаштовану на саудівську культуру та арабськомовні промпти. Це перша модель зображень, створена з Firefly Foundry для стороннього партнера.", "Adobe також запустила підтримку сучасної стандартної арабської з письмом справа наліво в Adobe Express на десктопі, вебі та iOS глобально, включно з типографікою, редагуванням тексту та UI. Стартапи з програм MCIT (CODE, The Garage) отримають рік безкоштовних інструментів і навчання з початку 2027 року, а Adobe Digital Academy займатиметься перекваліфікацією."], "means": "Для Luminar це ринковий сигнал: Adobe масово роздає безкоштовний Firefly з генерацією і редагуванням на цілий регіон, знижуючи планку очікуваної ціни за генеративні фічі на кшталт GenErase/GenSwap. Якщо MENA є в наших планах для Luminar Mobile, конкурувати за платну підписку там буде важче ще принаймні рік. Локалізовані під культуру моделі та RTL-підтримка — нагадування, що арабська локалізація UI та пресетів досі є прогалиною.", "importance": 2, "category": "market", "media": {"kind": "image", "hero_image": 0, "video": null}, "page": {"images": [{"uri": "/img/279f2c98c55d.jpg", "w": 1000, "h": 700, "alt": ""}, {"uri": "/img/98a1f1a944c3.jpg", "w": 750, "h": 362, "alt": ""}, {"uri": "/img/46ed20ce2805.jpg", "w": 750, "h": 971, "alt": ""}, {"uri": "/img/2d2b4b98899a.jpg", "w": 750, "h": 938, "alt": ""}, {"uri": "/img/1725e6bbefbd.jpg", "w": 750, "h": 429, "alt": ""}, {"uri": "/img/28916cdcbcff.jpg", "w": 750, "h": 429, "alt": ""}, {"uri": "/img/ef628c24e806.jpg", "w": 750, "h": 421, "alt": ""}], "videos": []}}, {"id": "f49ce3b33a", "source": "digitalcameraworld.com", "url": "https://www.digitalcameraworld.com/photography/photo-editing/we-speak-to-thousands-of-photographers-every-year-how-capture-one-builds-the-future-of-professional-workflows-by-providing-technology-that-almost-seems-to-melt-away", "date": "2026-08-30T03:22:43+00:00", "title": "CEO Capture One: тисячі розмов із фотографами й тетеринг Hasselblad до кінця року", "lead": "Digital Camera World опублікував інтерв'ю з CEO Capture One Рафаелем Ортою про те, як компанія будує продукт через студійні візити та події, і підтвердив тетеринг для камер Hasselblad до кінця 2026 року.", "full": ["Орта наголошує, що Capture One щороку спілкується з тисячами фотографів — на виставках, у школах і безпосередньо в студіях (наприклад, нещодавні візити в Париж), і саме ці розмови формують роадмап. Ключовим елементом досвіду він називає тетеринг: підключена до робочої станції камера залучає до зйомки всю команду.", "Компанія має близько 122 співробітників у Данії, Греції, Лондоні та США і зосереджена на комерційній, fashion- і рекламній фотографії. Обіцяний тетеринг Hasselblad фокусується на швидкості передачі файлів, надійності та стабільності з'єднання."], "means": "Прямого впливу на фічі Luminar Neo немає: Capture One закріплюється в професійній студійній ніші, куди ми не йдемо. Корисний як контекст позиціонування — їхня ставка на тетеринг і «невидиму технологію» протилежна нашій ставці на AI-інструменти на кшталт Enhance AI і Sky AI для ентузіастів.", "importance": 2, "category": "comp", "media": {"kind": "image", "hero_image": 0, "video": null}, "page": {"images": [{"uri": "/img/15e099c0bba3.jpg", "w": 1000, "h": 562, "alt": ""}], "videos": []}}, {"id": "9288b43d59", "source": "nerdbot", "url": "https://nerdbot.com/2026/08/28/picsart-wants-to-build-you-an-influencer-without-ever-showing-your-face/", "date": "2026-08-28T09:53:12+00:00", "title": "Picsart Persona: генератор постійного AI-персонажа для «безликих» креаторів", "lead": "Picsart (130 млн MAU) просуває Persona — інструмент, що створює персонажа за обраним «вайбом», анімує його у короткі відео для TikTok, Reels і Shorts і дозволяє повторно використовувати той самий образ у нових сценах.", "full": ["Персонаж стартує з одного дизайну: замість порожнього промпта користувач обирає готову естетику, а далі змінює вбрання й сцену через image-to-image, зберігаючи обличчя й пропорції. Підтримуються реалістичні люди з деталями шкіри, тварини, фентезі-істоти та маскоти. Запущено на початку березня 2026 року.", "Під капотом Picsart автоматично маршрутизує кожен запит до найбільш підхожої відеомоделі, серед яких Veo 3.1 і Kling 3.0. Компанія цілиться в ринок інфлюенс-маркетингу ($40 млрд) і малий бізнес, якому потрібна регулярна присутність без камери."], "means": "Для Luminar Mobile це приклад, як tier-2 конкурент іде від редагування фото до генерації контенту з консистентним персонажем через оркестрацію сторонніх моделей. Технічно цікава саме консистентність ідентичності при image-to-image — те, що потрібно було б GenSwap для заміни людей у кадрі. Прямої загрози фоторедагуванню немає, але показує, куди Picsart веде аудиторію соцмереж.", "importance": 2, "category": "comp", "media": {"kind": "gallery", "hero_image": 0, "video": null}, "page": {"images": [{"uri": "/img/2478f9f0338b.jpg", "w": 634, "h": 360, "alt": ""}, {"uri": "/img/54c744cee4e4.jpg", "w": 788, "h": 306, "alt": ""}, {"uri": "/img/886debf38a91.jpg", "w": 788, "h": 256, "alt": ""}], "videos": []}}, {"id": "65f86a28f0", "source": "Adobe", "url": "https://blog.adobe.com/en/publish/2026/08/27/new-photoshop-innovations-bring-you-more-choice-control-at-every-stage-of-your-creative-process", "date": "2026-08-27T07:00:00+00:00", "title": "Adobe оновила Photoshop: AI Assisted Editor, Light Adjustment Layer, Markup", "lead": "27 серпня Adobe випустила великий апдейт Photoshop: новий шар Light Adjustment Layer із Camera Raw-контролями, Instruct Edit with Masks на Firefly Image 5, інструмент Markup для «малювання» правок і окремий бета-режим AI Assisted Editor для промпт-редагування.", "full": ["Light Adjustment Layer — новий недеструктивний коригувальний шар з повзунками Exposure, Contrast, Highlights, Shadows, Whites і Blacks; Adobe обіцяє результат рівня Camera Raw без виходу зі звичного шарового воркфлоу Photoshop. Instruct Edit with Masks на базі Firefly Image 5 розуміє контекст усього зображення: користувач текстом описує точну правку (відкрити закриті очі, надіти капелюх на конкретну людину), а незамасковані зони, як-от обличчя чи логотипи, лишаються недоторканими.", "Markup дозволяє показати моделі бажаний результат прямо на зображенні: виділити ділянку для перефарбування, намалювати стрілку для позиціювання чи грубо накидати форму нового об'єкта, що const COPY='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';

function media(it){

}
function lbStep(d){const n=lb.i+d;if(n<0||n>=lb.it.page.images.length)return;lb.i=n;lbRender()}
function lbClose(){const el=document.getElementById('lb');if(el)el.hidden=true;document.body.style.overflow=''}
document.addEventListener('keydown',e=>{const el=document.getElementById('lb');if(!el||el.hidden)return;
  if(e.key==='Escape')lbClose();else if(e.key==='ArrowLeft')lbStep(-1);else if(e.key==='ArrowRight')lbStep(1);else return;e.preventDefault()});
document.getElementById('feed').addEventListener('click',e=>{
  const o=e.target.closest('.lb-open');
  if(o){const it=ITEMS.find(x=>x.id===o.closest('.post').dataset.id);if(it)lbOpen(it,+o.dataset.i);return}
  if(e.target.closest('.loadmore')){shown+=20;render();return}
  const sl=e.target.closest('.copy');
  if(sl){
    const it=ITEMS.find(x=>x.id===sl.closest('.post').dataset.id); if(!it) return;
    const txt=location.origin+'/p/'+it.id;
    const done=ok=>{sl.innerHTML=COPY+(ok?'Скопійовано':'Не вдалось');setTimeout(()=>{sl.innerHTML=COPY+'Копіювати'},1800)};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>done(true),()=>done(false))}
    else{const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}ta.remove();done(ok)}
    return;
  }
  const m=e.target.closest('.more'); if(!m) return;
  const id=m.closest('.post').dataset.id;
  state.open.has(id)?state.open.delete(id):state.open.add(id); render();
});
render();
</script>
