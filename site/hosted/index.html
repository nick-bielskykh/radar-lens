<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lens Radar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Single-theme by design: matches skylum.com (black ground, white type) */
:root{
  --bg:#000; --surface:#111214; --surface2:#1a1b1e; --line:#26272b; --line2:#3a3b40;
  --ink:#fff; --ink2:#b5b7bd; --ink3:#77797f;
  --accent:#f5c445; --accent-ink:#1a1200;
  --neo:#7c9cff; --mob:#5fd3a6;
  --sans:'Manrope',Roobert,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;margin:0;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:inherit}

.top{border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:18px 20px}
.brand{font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase}

.layout{max-width:760px;margin:0 auto;padding:28px 20px 80px}
.feed{display:flex;flex-direction:column;gap:14px}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.chip{border:1px solid var(--line2);border-radius:8px;padding:6px 13px;font-size:13px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;gap:7px}
.chip.on{background:#fff;color:#000;border-color:#fff}
.chip .dot{width:7px;height:7px;border-radius:50%}
.daysep{font-size:13px;color:var(--ink3);font-weight:600;padding:14px 0 2px;letter-spacing:.02em}

/* ---------- post ---------- */
.post{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 22px 14px;display:flex;flex-direction:column;gap:12px}
.head{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink3)}
.head .src{color:var(--ink);font-weight:600;display:flex;align-items:center;gap:8px}
.head .src i{width:20px;height:20px;border-radius:6px;background:var(--surface2);border:1px solid var(--line2);display:inline-grid;place-items:center;font-size:10px;font-weight:700;color:var(--ink2)}
.head .cat{display:inline-flex;align-items:center;gap:6px}
.head .cat::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.head .imp{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12px;padding:3px 9px;border-radius:6px;background:var(--surface2);color:var(--ink2)}
.head .imp.hi{background:var(--accent);color:var(--accent-ink)}
h3.title{font-size:22px;font-weight:600;line-height:1.25;margin:0;letter-spacing:-.01em;text-wrap:balance}
.post.big h3.title{font-size:26px}
.lead{margin:0;color:var(--ink2);font-size:15px}

.media{position:relative;border-radius:10px;overflow:hidden;background:var(--surface2);aspect-ratio:16/9}
.media .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.vlink{position:absolute;inset:0;display:block}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal .more{position:relative}.gal .more img{position:absolute;inset:0}.gal .more::after{content:attr(data-n)}
.thumbs a{display:block;aspect-ratio:4/3;border-radius:8px;overflow:hidden;border:1px solid var(--line)}.thumbs a img{width:100%;height:100%;object-fit:cover;display:block}.thumbs a.vt{display:grid;place-items:center;background:var(--surface2);color:var(--ink2);font-size:12px;font-weight:600;text-decoration:none}
.tag{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.7);color:#fff;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:6px}
.play{position:absolute;inset:0;display:grid;place-items:center}
.play i{width:60px;height:60px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.play i::after{content:"";border-left:18px solid #000;border-top:11px solid transparent;border-bottom:11px solid transparent;margin-left:5px}
.dur{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.7);color:#fff;font-size:12px;font-weight:600;padding:3px 7px;border-radius:6px}
.gal{position:absolute;inset:0;display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:3px}
.gal > :first-child{grid-row:1/3}
.gal .more{display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px;position:relative;isolation:isolate}.gal .more img{position:absolute;inset:0;z-index:-1;filter:brightness(.5)}
.srcnote{position:absolute;right:10px;top:10px;background:rgba(0,0,0,.7);color:var(--ink2);font-size:11px;padding:4px 8px;border-radius:6px}

.foot{display:flex;align-items:center;gap:14px;padding-top:4px;border-top:1px solid var(--line);margin-top:2px}
.more{font-weight:600;font-size:14px;padding:8px 0;display:inline-flex;align-items:center;gap:8px}
.more::after{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .2s}
.post.open .more::after{transform:rotate(-135deg) translateY(-2px)}
.post.hl{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.post{scroll-margin-top:16px}
.foot .copy{margin-left:auto;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);display:inline-flex;align-items:center;gap:7px;color:var(--ink2);font-size:13px;font-weight:600}
.foot .copy:hover{color:var(--ink);border-color:var(--ink)}
.foot .src-link{font-size:13px;color:var(--ink3);text-decoration:none}
.foot .src-link:hover{color:var(--ink)}

.detail{display:none;flex-direction:column;gap:12px;padding-top:2px}
.detail .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.detail .lab em{font-style:normal;font-weight:500;letter-spacing:0;text-transform:none;margin-left:8px}
.detail .full{font-size:15px;color:var(--ink2);max-width:62ch}
.detail .means{font-size:15px;color:var(--ink);max-width:62ch;margin-bottom:6px}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 8px}
.thumbs div{aspect-ratio:4/3;border-radius:8px;overflow:hidden;position:relative;cursor:pointer}
.thumbs div span{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;color:#fff;background:rgba(0,0,0,.35)}
.detail .lab{margin-top:4px}
.post.open .detail{display:flex}
.detail p{margin:0}

.loadmore{align-self:center;margin-top:10px}

</style>

<div class="top"><div class="top-in"><div class="brand">Lens Radar</div></div></div>

<div class="layout">
  <main class="feed" id="feed"></main>
</div>

<script>
const CATS={comp:{n:'Конкуренти',c:'#4c7bd9'},ai:{n:'AI-моделі',c:'#b04fd0'},algo:{n:'Алгоритми',c:'#2e9b8a'},market:{n:'Ринок',c:'#c9781a'}};
const ITEMS=[{"id": "0559cbad2d", "source": "Fstoppers", "url": "https://fstoppers.com/education/delete-someone-group-photo-without-ever-opening-photoshop-904484?utm_source=fstoppers&utm_medium=RSS&utm_campaign=rss_feed_articles", "date": "2026-09-06T09:03:01+00:00", "title": "Lightroom видаляє людину з групового фото через Firefly без Photoshop", "lead": "Fstoppers розібрав воркфлоу Гліна Дьюїса: вбудований Remove у Lightroom не впорався з видаленням людини з центру групи, а відправка кадру у Firefly з текстовим промптом дала чистий результат.", "full": ["Вбудований інструмент Remove з увімкненим генеративним AI добре відновив фон, але зіпсував руку сусіда. Робочий метод — меню Photo → Generating Firefly → Edit Photo: кадр іде на сайт Firefly, де можна обрати модель — Firefly Image 5, модель зображень ChatGPT або Google Gemini 3.1. Промпт описує, кого прибрати, як зсунути решту людей і що зберегти незмінним (обличчя, волосся, одяг, кольори). Через приблизно півтори хвилини троє людей стоять поруч без слідів монтажу.", "Ціна в кредитах: перемикання на модель ChatGPT у високій якості піднімає вартість з 20 до 80 кредитів за правку. Регенерований файл повертається меншим за оригінал 6060×4040, тож потрібен апскейл, а готовий результат падає в папку завантажень, а не в каталог Lightroom.", "Автор підкреслює: Firefly не кращий за Photoshop, але такі правки більше не потребують шарів і масок, що відкриває їх звичайним користувачам з телефонними знімками."], "means": "Adobe робить видалення й перекомпонування людей доступним прямо з Lightroom через сторонні моделі (ChatGPT, Gemini) — це територія нашого Erase та GenErase. Показові вузькі місця: втрата роздільної здатності, розрив каталогу і 80 кредитів за правку. Luminar Neo може виграти, якщо GenErase поверне результат у повній роздільній здатності в межах каталогу й з прозорими лімітами, а Luminar Mobile — дати промпт-керування Erase для сімейних фото.", "importance": 3, "category": "comp", "media": {"kind": "image", "hero_image": 0, "video": null}, "page": {"images": [{"uri": "img/6a29ef80b604.jpg", "w": 1000, "h": 565, "alt": "Side-by-side comparison showing person circled in left image removed from right image, with Photoshop and Lightroom logos"}], "videos": []}}, {"id": "b978f84236", "source": "financialexpress.com", "url": "https://www.financialexpress.com/life/technology/ai-big-smartphone-pitch-but-basics-remain-prime/4332841/", "date": "2026-09-05T19:31:08+00:00", "title": "Опитування: генеративне фоторедагування — друга найбажаніша AI-функція смартфонів", "lead": "За даними Amazon India (40 000+ респондентів) AI-функції впливають на вибір смартфона у 82% покупців; генеративне фоторедагування назвали найбажанішою можливістю 18%, поступаючись лише контекстному асистенту (25%).", "full": ["Counterpoint Research фіксує, що процесор залишається головним критерієм для 29% покупців (24% роком раніше), а Amazon називає драйверами покупки продуктивність (87%), батарею (79%) і камеру (77%). Камера — друга за частотою скарга на поточний телефон (17%).", "AI-редагування стає стандартом у середньому сегменті: OnePlus N6 має AI Eraser та AI Reflection Eraser, Nothing Phone (4b) — AI Eraser, Redmi Note 15 отримує Gemini і Circle to Search. Pixel 11 Pro (12 серпня) поглибив інтеграцію Gemini, а нові iPhone оголосять 9 вересня з чіпом A20 Pro для on-device Apple Intelligence.", "Аналітики Counterpoint підсумовують, що AI перетворюється на функціональний критерій, здатний впливати на рішення про покупку."], "means": "Для Luminar Mobile ринок підтверджує попит на генеративне редагування, але одночасно вбудовані AI Eraser з'являються навіть у бюджетних Android — базовий Erase перестає бути диференціатором. Наша перевага має лежати в якості Enhance, Sky, Relight та Portrait, які системні галереї не дають. Зростання on-device чипів (A20 Pro, Gemini на Pixel) робить локальну обробку через Core ML/NNAPI ще важливішою для швидкості й економії хмарних витрат.", "importance": 2, "category": "market", "media": {"kind": "none", "hero_image": null, "video": null}, "page": {"images": [{"uri": "img/7511d48af5fb.jpg", "w": 1000, "h": 562, "alt": ""}], "videos": []}}, {"id": "ac5917a78a", "source": "Fstoppers", "url": "https://fstoppers.com/photoshop/20-photoshop-and-camera-raw-updates-probably-missed-904471?utm_source=fstoppers&utm_medium=RSS&utm_campaign=rss_feed_articles", "date": "2026-09-05T11:03:01+00:00", "title": "20 нових функцій Photoshop і Camera Raw 18.6: фокус-точки, Glow, GenExpand на RAW", "lead": "Fstoppers зібрав 20 нещодавніх оновлень Photoshop та Camera Raw, зокрема оверлей точок автофокусу, ефект Glow, вектороскоп, генеративне розширення на RAW і збереження текстури шкіри при видаленні дефектів.", "full": ["Camera Raw 18.6 показує точки автофокусу з RAW-файлу (правий клік → Show autofocus points, Cmd+Opt+Shift+O), що допомагає відсіювати кадри з промахом фокуса. У блоці Effects з'явився Glow з трьома стилями — Diffusion, Bloom, Halation; додано вектороскоп з індикатором тону шкіри, а колірні кола й повзунки Feather/Edge перенесені в маски.", "Generative Expand у Camera Raw працює безпосередньо з RAW і зберігає баланс білого, світла й тіні без видимого шва — у самому Photoshop розширення можливе лише на запеченому зображенні. Інструмент видалення плям (blemish removal) залишає реальну текстуру шкіри з окремими повзунками для плям і родимок. Усі генеративні функції можна вимкнути в налаштуваннях.", "Photoshop 27.1 отримав AI-режим без шарів і каналів: розмітка, вибір областей і бета-функція Tune, що переводить сцену з дня у вечір. Автор радить використовувати AI-режим для швидких концептів, а «Pro editor» — для масок і композитингу."], "means": "Adobe закриває одразу кілька наших ніш: Glow конкурує з Magic Light AI та Atmosphere AI, blemish removal із збереженням текстури — зі Skin AI, GenExpand на RAW із збереженням проявки — з нашим GenExpand, а Tune «день → вечір» перетинається з Relight AI та Twilight Enhancer. Оверлей точок автофокусу — дешева функція для кулінгу, якої в Neo немає. Окремий AI-режим без шарів підтверджує нашу ставку на простий інтерфейс.", "importance": 3, "category": "comp", "media": {"kind": "image", "hero_image": 0, "video": null}, "page": {"images": [{"uri": "img/acafd81878eb.jpg", "w": 1000, "h": 565, "alt": "Graphic showing a man gesturing next to Photoshop and Affinity Photo logos with text '20 FEATURES IN 20 MINS'"}], "videos": []}}, {"id": "73a608d2b2", "source": "digitalcameraworld.com", "url": "https://www.digitalcameraworld.com/tech/artificial-intelligence/i-asked-canon-about-in-camera-ai-we-are-going-to-use-ai-not-to-generate-imagery-but-to-capture-scenes-as-close-to-the-reality-of-shooting-as-possible", "date": "2026-09-05T09:10:00+00:00", "title": "Canon: AI у камерах — для шумозаглушення й корекції, а не генерації зображень", "lead": "Керівництво Canon на CP+ 2026 заявило Digital Camera World, що використовуватиме AI лише для наближення знімка до реальності — денойз, корекція кольору, дисторсії та аберацій — і не планує генеративних функцій у камерах.", "full": ["Тецуші Хібі з Canon Image Optical Business Unit 1 окреслив позицію компанії: AI має покращувати захоплення сцени, а не створювати зображення. Це вже реалізовано у EOS R1 та R5 Mark II через нейромережеву обробку NnIP: апскейл 400% у камері, шумозаглушення на 2 стопи, AI-розпізнавання й трекінг об'єктів. У травні Canon також запустила систему Authenticity Imaging для верифікації справжності знімків.", "Привід для статті — камера Caira від Camera Intelligence, яка додала генеративне відеоредагування на Nano Banana до своїх genAI-фотофункцій. Canon натомість застосовує AI у проєктуванні: симуляції дроп-тестів і теплового режиму на етапі прототипування."], "means": "Виробники камер переносять денойз і апскейл у сам корпус (2 стопи шуму, 400% апскейл на R1/R5 II), що поступово зменшує потребу в Noiseless AI та Upscale AI на десктопі для нових камер Canon. Водночас генеративне редагування Canon свідомо залишає софту — це простір для GenErase, GenSwap, Sky AI. Тренд на верифікацію справжності (Authenticity Imaging, Content Credentials) варто врахувати в експорті з Luminar Neo.", "importance": 2, "category": "market", "media": {"kind": "image", "hero_image": 0, "video": null}, "page": {"images": [{"uri": "img/cb40c2e20784.jpg", "w": 1000, "h": 562, "alt": ""}], "videos": []}}, {"id": "94af8599b6", "source": "Fstoppers", "url": "https://fstoppers.com/education/photoshop-just-replaced-brightness-and-contrast-something-better-904470?utm_source=fstoppers&utm_medium=RSS&utm_campaign=rss_feed_articles", "date": "2026-09-05T09:03:01+00:00", "title": "Photoshop замінив Brightness/Contrast новим шаром Light із контролями Camera Raw", "lead": "У Photoshop з'явився коригувальний шар Light, який виносить Exposure, Contrast, Highlights, Shadows, Whites і Blacks з Camera Raw у головний редактор як недеструктивний шар; старий алгоритм доступний у режимі Legacy.", "full": ["Аарон Нейс (PHLEARN) пояснює, що Light — новий шар у лінійці Grain, Clarity, Dehaze і Color, які Adobe поступово переносить із Camera Raw у Photoshop. Повернути стару поведінку можна через приховане меню у панелі Properties, перемкнувши версію на Legacy.", "Рекомендований порядок повзунків: Exposure, потім Whites і Blacks, далі Highlights і Shadows, Contrast — останнім. Автор радить починати з Select Subject, щоб шар автоматично отримав маску, і працювати окремими шарами Light для фону та об'єкта. Шар Color додає температуру, відтінок і vibrance у тому ж недеструктивному потоці.", "Особливість поведінки: під час редагування шару під Light Photoshop тимчасово ховає шари Light вище, щоб показати чистий ефект — це зроблено навмисно."], "means": "Adobe зближує Photoshop і Lightroom/ACR, зменшуючи причину тримати другий редактор для тонової корекції. Для Luminar Neo це аргумент за те, щоб наші Layers працювали з тими ж RAW-контролями і автомасками Mask AI (людина, небо, фон) без додаткових кроків — сценарій «окремий шар на об'єкт і фон» уже є нашою сильною стороною. Для Mobile важливо, що навіть у Photoshop базовий потік стає «Select Subject + кілька повзунків».", "importance": 3, "category": "comp", "media": {"kind": "image", "hero_image": 0, "video": null}, "page": {"images": [{"uri": "img/30b22b6c3bfc.jpg", "w": 1000, "h": 565, "alt": "Screenshot showing Photoshop's new Light Adjustment Layer feature with a woman in black jacket standing in a green field"}], "videos": []}}, {"id": "d25a782555", "source": "ON1", "url": "https://www.on1.com/blog/august-2026-on1-recap-nonoise-ai-free-guide/", "date": "2026-09-04T19:56:02+00:00", "title": "ON1 анонсував NoNoise AI 2027 із селектором моделей для wildlife, астро і людей", "lead": "ON1 представив перероблений NoNoise AI 2027 для високих ISO з вибором моделі під тип сюжету, оновленими моделями TackSharp AI та автоматичними масками об'єкта і фону; передзамовлення відкрито, вихід — наприкінці вересня 2026.", "full": ["Нові моделі шумозаглушення націлені на найскладніші сценарії: дика природа на світанку, концерти під сценічним світлом, Чумацький Шлях (ISO 6400–12 800). За словами VP продукту Дена Гарлахера, мета — прибрати шум, зберігши дрібні деталі, а не отримати «пласку картину». Селектор моделей дозволяє в один клік обрати Wildlife, People, Astro або сканована плівка; автомаски об'єкта та фону дають різні налаштування для кожної зони. Оновлено й моделі деблюру TackSharp AI.", "У серпневому дайджесті ON1 також: туторіал з релайту пласких фото через окремі маски Subject/Background у Local Adjustments, набір з 10 плівкових light leaks Analog Glow для Creative Library, безкоштовний гайд для початківців і порівняння ON1 vs Topaz. ON1 нагадує, що з серпня 2026 усі тарифи Topaz — лише за підпискою, тоді як ON1 продається як довічна ліцензія.", "ON1 Photo RAW має 30-денну безкоштовну пробну версію без підписки."], "means": "NoNoise AI 2027 — прямий конкурент Noiseless AI, а вибір моделі під сюжет (wildlife/люди/астро/плівка) і окремі налаштування для об'єкта й фону — те, чого в нашому денойзі немає. Оновлений TackSharp AI перетинається із Supersharp AI. Варто перевірити якість на ISO 12 800 після релізу наприкінці вересня. Маркетинговий кут «довічна ліцензія проти підписки Topaz» збігається з нашою моделлю — можна використати в комунікації.", "importance": 4, "category": "comp", "media": {"kind": "gallery", "hero_image": 0, "video": null}, "page": {"images": [{"uri": "img/913f8648e54b.jpg", "w": 1000, "h": 562, "alt": "NoNoise AI 2027 noise reduction applied to a high-ISO wildlife photo of a hawk"}, {"uri": "img/1c786594d94d.jpg", "w": 1000, "h": 562, "alt": ""}, {"uri": "img/d30103a4841b.jpg", "w": 1000, "h": 562, "alt": "NoNoise AI 2027 first look video thumbnail on a high-ISO wildlife photo"}, {"uri": "img/bb7372fb8692.jpg", "w": 1000, "h": 562, "alt": "ON1 Photo RAW Local Adjustments panel with separate Subject and Background masks"}, {"uri": "img/fa9934107a16.jpg", "w": 1000, "h": 666, "alt": "ON1's free Beginner's Guide to Photography eBook"}, {"uri": "img/48ce6ffdb1cb.jpg", "w": 1000, "h": 561, "alt": "Analog Glow Light Leaks applied to a photo in ON1 Photo RAW, warm amber light leak over the frame"}, {"uri": "img/a577f42b164d.jpg", "w": 1000, "h": 562, "alt": "ON1 vs Topaz blog post hero graphic comparing the two photo editing tools"}], "videos": []}}, {"id": "1feb30299b", "source": "Tech Times", "url": "https://www.techtimes.com/articles/326607/20260904/adobe-names-chakravarthy-ceo-agentic-bet-puts-informatica-playbook-photoshop-scale.htm", "date": "2026-09-04T15:37:11+00:00", "title": "Adobe призначила Аніла Чакраварті новим CEO зі ставкою на агентний AI", "lead": "За повідомленням Tech Times, Adobe назвала Аніла Чакраварті наступним CEO і президентом; видання описує це як перенесення «агентного» підходу з Informatica на масштаб Photoshop.", "full": ["Повного тексту статті немає; за заголовком і анонсом, Adobe змінює керівництво, і новий CEO має досвід Informatica з побудови агентних (agentic) продуктів. Зміна ймовірно посилить курс Adobe на агентні сценарії редагування, який уже помітний в інтеграціях Firefly з ChatGPT, Claude, Copilot і Slack."], "means": "Зміна CEO tier-1 конкурента з явним акцентом на агентний AI означає, що Photoshop і Lightroom й далі рухатимуться до «опиши задачу — отримай результат». Для Luminar Neo і Mobile це підтверджує пріоритет промпт-керування нашими AI-інструментами (Erase, Relight AI, Sky AI) поверх окремих повзунків. Деталі стратегії варто відстежити в перших заявах нового керівника.", "importance": 2, "category": "market", "media": {"kind": "image", "hero_image": 0, "video": null}, "page": {"images": [{"uri": "img/010ec4bdf0c9.jpg", "w": 1000, "h": 593, "alt": ""}], "videos": []}}, {"id": "8455d4164f", "source": "techcrunch.com", "url": "https://techcrunch.com/2026/09/04/googles-gemini-spark-can-now-manage-your-google-photos-library/", "date": "2026-09-04T14:47:11+00:00", "title": "Google дав агенту Gemini Spark керування бібліотекою Google Photos", "lead": "Google оголосив, що персональний агент Gemini Spark може виконувати завдання в Google Photos: редагувати знімки, курувати альбоми, створювати спільні альбоми та запускати робочі процеси за текстовим запитом.", "full": ["За повідомленням TechCrunch, керівниця Google Photos Шимріт Бен-Яїр анонсувала інтеграцію 4 вересня. Користувач підключає Google Photos до Gemini, вмикає Spark у застосунку Gemini і пише запит — агент сам виконує дії з бібліотекою: редагує зображення, добирає найкращі кадри в альбоми, автоматично створює спільні альбоми, а фото афіші може перетворити на подію в календарі.", "Функція розгортатиметься протягом кількох тижнів лише для підписників Gemini AI Pro та Ultra у США й англійською мовою. Про терміни для інших ринків Google не повідомив.", "TechCrunch оцінює новину стримано: окремі такі функції не виглядають революційними, але показують, як Google намагається продати споживачам користь AI через автоматизацію рутини з великими фотобібліотеками."], "means": "Google переносить редагування з інструмента в агентний сценарій: користувач описує результат, а не тягне повзунки. Для Luminar Mobile це прямий орієнтир — наші хмарні Enhance, Sky, Erase, Relight можна виставити через єдиний текстовий вхід поверх бібліотеки. Для Neo варто стежити, чи з'являться в Spark масові операції (batch-редагування), бо це закриває сценарій «швидкий результат без навчання», на який ми орієнтуємось. Поки що доступ обмежений платними тарифами й США, тож вікно часу є.", "importance": 4, "category": "comp", "media": {"kind": "image", "hero_image": 0, "video": null}, "page": {"images": [{"uri": "img/290b301f56b3.jpg", "w": 1000, "h": 666, "alt": ""}, {"uri": "img/625dba2e05ee.jpg", "w": 1000, "h": 207, "alt": "Event Logo"}], "videos": []}}, {"id": "6cb33e338c", "source": "Amateur Photographer", "url": "https://amateurphotographer.com/latest/photo-news/i-came-back-with-over-20000-images-from-my-relaxing-city-break-heres-how-i-organised-and-edited-them-so-quickly/", "date": "2026-09-04T12:12:29+00:00", "title": "Excire Foto 2027: AI-каталогізація 24 000 RAW з подорожі замість Lightroom", "lead": "Amateur Photographer описує робочий процес фотографа Вілла Чунга, який відбирає та впорядковує знімки в Excire Foto 2027 з AI-пошуком і лише потім імпортує їх у Lightroom.", "full": ["Автор використовує Excire Foto 2027 для бібліотеки з понад 800 000 зображень: великі превʼю оновлюються майже миттєво, відбір браку проходить значно швидше, ніж у Lightroom, а рейтинги потім переносяться в наявні каталоги Lightroom. Автоматичне ключування та пошук за текстовим промптом (Find by Text Prompt) за кілька секунд знайшли 3650 фото гонконзьких трамваїв у всій базі.", "У версії 2027 зʼявилися AI Text Recognition (пошук за видимим текстом на фото — вивіски, назви вулиць, бренди), Map View з GPS-даними, Timeline для перегляду за датою, оновлений рядок пошуку та Survey view для звуження вибірки на чорному фоні."], "means": "Це не редактор, а DAM-шар перед Lightroom, але він показує, що сегмент «другого інструмента поруч із Lightroom» — саме наша аудиторія — цінує швидкий відбір і AI-пошук. У Luminar Neo каталог не має семантичного пошуку, автоключування чи OCR; це можлива точка зростання або партнерства, якщо ми хочемо утримувати користувача від імпорту до експорту.", "importance": 2, "category": "comp", "media": {"kind": "image", "hero_image": 0, "video": null}, "page": {"images": [{"uri": "img/888a16064dbc.jpg", "w": 1000, "h": 528, "alt": ""}], "videos": []}}, {"id": "e71bc96a54", "source": "SMBtech", "url": "https://smbtech.au/news/picsart-appoints-former-sada-cfo-to-lead-finances-as-platform-pivots-to-ai-video/", "date": "2026-09-04T09:44:08+00:00", "title": "Picsart призначила CFO і переорієнтовується з фото на AI-відео", "lead": "Picsart призначила Лусіне Єгіазарян, колишню CFO SADA Systems, фінансовою директоркою на тлі зміщення фокусу з фоторедагування на video-first AI-продакшн.", "full": ["Єгіазарян у SADA вела розширення в AI-сервіси, партнерство з Google Cloud і продаж компанії Insight Enterprises; раніше працювала в Diebold Nixdorf, Deloitte і GoPro. Її першочергове завдання — узгодити фінансову траєкторію Picsart із video-first напрямом, балансуючи дисципліну й темп інвестицій в AI.", "Picsart має понад 100 млн MAU і 2,5 млрд завантажень. За даними компанії, користувачі створили понад 1,1 млрд AI-відео та зображень, а використання AI за рік (серпень 2025 — серпень 2026) зросло на 270%. Екосистема включає відеоінструменти, Creative AI Agent Marketplace, CLI та MCP-інтеграцію, сумісну з Claude і Codex, і десктопний AI Playground."], "means": "Tier-2 конкурент відходить від фото у відео та агентні інтерфейси (CLI, MCP) — ніша мобільного фоторедагування для масового користувача стає менш пріоритетною для Picsart, що потенційно звільняє простір для Luminar Mobile. Водночас цифра +270% AI-використання підтверджує попит на хмарні генеративні функції на кшталт наших GenErase/GenSwap; MCP-інтеграція у Picsart — ще один сигнал стандартизації агентного доступу до редакторів.", "importance": 2, "category": "market", "media": {"kind": "none", "hero_image": null, "video": null}, "page": {"images": [], "videos": []}}, {"id": "a4f51742e2", "source": "ON1", "url": "https://www.on1.com/blog/august-2026-on1-plus-recap-color-droppers-live-edits-film-overlays/", "date": "2026-09-03T18:08:59+00:00", "title": "ON1 Plus за серпень: Color Droppers, live-edit локальних корекцій і плівкові оверлеї", "lead": "ON1 підбила підсумки серпневого контенту для підписників ON1 Plus: уроки з Color Droppers і Resize AI, live-edit із Local Adjustments, eBook про профілі камер і десять оверлеїв Film Vault.", "full": ["Урок з Color Droppers в ON1 Photo RAW 2026 показує виправлення балансу білого за сірою точкою, точкову корекцію одного кольору через Black and White і Color Enhancer, а також підбір кольору хмар під наявне небо для домальовування хмар. Live-edit із Local Adjustments демонструє градієнтні, радіальні та відбиті маски й Line Mask для створення глибини й напрямку світла.", "Окремі уроки присвячені випадкам, коли Quick Mask AI і Super Select AI не знаходять обʼєкт (пристань, порожній човен), Resize AI зі збільшенням до 8x і композитингу через Quick Mask AI з шарами. Film Vault — десять оверлеїв із пилом, подряпинами й перфорацією та кольоровими кастами від бурштинового до бірюзового з реальних плівок.", "Увесь контент входить у членство ON1 Plus; ON1 Photo RAW 2026 має 30-денний тріал без підписки."], "means": "Це не реліз, а контент-маркетинг, але він показує, як ON1 монетизує навчання через окрему підписку ON1 Plus і які фічі просуває: автомаски (аналог Mask AI), апскейл до 8x (Upscale AI), домальовування хмар (Sky AI/Atmosphere AI) і плівкові оверлеї (Film Grain, пресети). Для Luminar Neo — підказка щодо форматів навчального контенту й пакування розширень.", "importance": 2, "category": "comp", "media": {"kind": "gallery", "hero_image": 0, "video": null}, "page": {"images": [{"uri": "img/10a036c7d216.jpg", "w": 1000, "h": 562, "alt": "Cloud Shapes panel in ON1 Photo RAW 2026 with Color Droppers sampling sky tones over a mountain landscape"}, {"uri": "img/a9d6096df1ec.jpg", "w": 1000, "h": 562, "alt": ""}, {"uri": "img/d7de65e3faff.jpg", "w": 1000, "h": 567, "alt": "Film Vault Overlays light leak effect applied to a row of palm trees against a blue sky"}, {"uri": "img/37c1feb87647.jpg", "w": 1000, "h": 1249, "alt": "ON1 Plus Camera Profiles eBook cover"}], "videos": []}}, {"id": "39c450020f", "source": "TechJuice", "url": "https://www.techjuice.pk/snapseed-4-android-update-google/", "date": "2026-09-03T11:04:21+00:00", "title": "Snapseed 4.0 для Android: Smart Masking, batch-редагування та плівкова камера", "lead": "Google випустила Snapseed 4.0 для Android — першу велику версію майже за два роки — з розумними масками, batch-редагуванням і вбудованою камерою; застосунок лишається повністю безкоштовним.", "full": ["Smart Masking виділяє обʼєкт або фон одним дотиком без ручного пензля, Batch Editing застосовує збережені луки й окремі корекції одразу до кількох фото. Android раніше сидів на версії 2.22 (2024), тоді як iOS отримала 3.0 у червні 2025-го. Snapseed Camera знімає з емуляціями Kodak Portra, Fujifilm Superia, Polaroid SX-70 та Ilford HP5 у реальному часі, ефекти лишаються оборотними після зйомки; є Pro-режим з ISO, витримкою та фокусом.", "Інтерфейс перероблено: домашня сітка з попередніми правками, оновлений набір інструментів з меншою кількістю дотиків, необмежена кількість закріплених інструментів замість чотирьох. Нові інструменти — Color HSL, Dehaze, Halation і Bloom, разом понад 30 інструментів (Healing, Selective, Lens Blur, Curves, Double Exposure). Редагування недеструктивне.", "Поетапне розгортання почалося 8 травня, iOS одночасно отримала 4.0 з новим інтерфейсом, Halation і Bloom. Snapseed лишається без підписки, водяних знаків і покупок — на тлі того, що майже всі здібні мобільні редактори перейшли на підписку."], "means": "Безкоштовний tier-1 редактор Google на Android тепер має автомаски (аналог Mask AI), батч-обробку та Dehaze — те, чого нашій слабшій Android-версії Luminar Mobile бракує найбільше. Halation/Bloom і плівкові емуляції перетинаються з нашими пресетами і Film Grain. Потрібно переоцінити ціннісну пропозицію підписки Luminar Mobile на Android: наш аргумент — хмарні Sky, Erase, Relight і Portrait, яких у Snapseed немає.", "importance": 4, "category": "comp", "media": {"kind": "image", "hero_image": 0, "video": null}, "page": {"images": [{"uri": "img/64ddb8a03ffa.jpg", "w": 1000, "h": 562, "alt": ""}], "videos": []}}, {"id": "df9552db8c", "source": "Adobe", "url": "https://blog.adobe.com/en/publish/2026/09/02/introducing-adobe-for-slack", "date": "2026-09-03T04:21:10+00:00", "title": "Adobe for Slack: 70+ інструментів Photoshop, Firefly і Lightroom усередині Slackbot", "lead": "Adobe випустила застосунок Adobe for Slack — MCP-інтеграцію, через яку Slackbot викликає понад 70 інструментів Firefly, Express, Photoshop, Lightroom, Acrobat та інших сервісів прямо з чату.", "full": ["Застосунок уже доступний для команд на тарифах Slack Business+ та Enterprise+. Користувач описує потрібний результат Slackbot, а той сам обирає відповідні інструменти Adobe і може підтягувати контекст з розмов, файлів, каналів і Canvas. Почати можна без облікового запису Adobe, а вхід у безкоштовний акаунт відкриває додаткові функції.", "Серед сценаріїв — генерація зображень і відео через Firefly, створення PDF з файлів і таблиць, пошук у бібліотеці Creative Cloud за темою чи настроєм, адаптація креативів під розміри соцмереж і пакетна обробка фото: видалення фону та відволікаючих обʼєктів, корекція світла й тону, кадрування і ресайз наборів знімків (хедшоти, фото з подій, товарні картки).", "Adobe називає це частиною стратегії виносити свої інструменти в AI-чатботи: інтеграції вже є для ChatGPT, Claude і Copilot, Gemini обіцяють незабаром. Для точного піксельного контролю користувача перенаправляють у повноцінні застосунки — Photoshop, Premiere, Firefly."], "means": "Adobe перетворює редагування на агентний сценарій: «видали фон і вирівняй світло на цих 30 фото» виконується без відкриття редактора. Це тисне на цінність наших Erase, Relight AI і пакетних пресетів як окремих кроків у застосунку. Для Luminar Neo варто оцінити MCP-обгортку над хмарними інструментами (GenErase, Sky AI, Enhance) — це дешевий канал дистрибуції в чатботи, який Adobe уже займає.", "importance": 3, "category": "comp", "media": {"kind": "image", "hero_image": 0, "video": null}, "page": {"images": [{"uri": "img/93622cec9e8f.jpg", "w": 750, "h": 329, "alt": "Adobe for Slack"}, {"uri": "img/63bb62de198a.jpg", "w": 1000, "h": 438, "alt": ""}, {"uri": "img/72c3879160f8.jpg", "w": 750, "h": 329, "alt": "Adobe for Slack"}], "videos": []}}, {"id": "9d4c0b5587", "source": "Fstoppers", "url": "https://fstoppers.com/landscapes/lightroom-classic-preset-trick-regenerates-masks-every-photo-904439?utm_source=fstoppers&utm_medium=RSS&utm_campaign=rss_feed_articles", "date": "2026-09-02T13:03:02+00:00", "title": "Lightroom Classic: пресети з AI-масками перегенеровують сегментацію на кожному фото", "lead": "Fstoppers розбирає робочий процес Terry Vander Heiden: у Lightroom Classic AI-маски ландшафту (небо, гори, рослинність, вода, земля) зберігаються в пресет і автоматично перебудовуються під кожен новий знімок.", "full": ["Маски Lightroom, засновані на розпізнаванні сцени, можна запекти у користувацький пресет. Після застосування до нової фотографії програма за секунду-дві генерує маски саме для цього кадру, а не копіює їх із попереднього. Якщо елемент (наприклад, природний ґрунт) не знайдено, маска позначається попередженням і її просто видаляють.", "Автор показує два варіанти: пресет із повним набором правок для серії схожих кадрів і «легкий» пресет, який лише створює маски, залишаючи редагування вручну. Ідея — прогнати всю поїздку через масковий пресет одразу після імпорту, щоб кожен кадр був попередньо сегментований. Також описано швидке створення віртуальних копій, перегляд кліпінгу та чорно-білу конверсію через Color Mixer."], "means": "У Luminar Neo Mask AI вміє те саме розпізнавання (небо, вода, рослинність, людина), але сценарій «маски як частина пресета, що перегенеровуються на кожному фото» — сильний аргумент Lightroom для пакетної роботи. Варто перевірити, чи наші Presets із локальними правками на Mask AI відпрацьовують так само автоматично на новому знімку, і показати це в комунікації.", "importance": 2, "category": "comp", "media": {"kind": "image", "hero_image": 0, "video": null}, "page": {"images": [{"uri": "img/4b48db421ffe.jpg", "w": 1000, "h": 565, "alt": "Tutorial thumbnail featuring instructor in plaid shirt with landscape photography preset creation interface"}], "videos": []}}, {"id": "6af7286517", "source": "IT Brief UK", "url": "https://itbrief.co.uk/story/photoroom-launches-visual-agents-for-enterprise-catalogues", "date": "2026-09-02T08:46:00+00:00", "title": "Photoroom запускає Visual Agents для каталогів: моделі проходять перевірку лише у 29% випадків", "lead": "Photoroom представив Visual Agents — корпоративну систему, яка автоматизує AI-генерацію товарних фото й відео з перевіркою точності та повторними спробами, і оприлюднив бенчмарк точності моделей редагування.", "full": ["Visual Agents будує пайплайн навколо вхідних каталожних зображень: обирає модель редагування під задачу, порівнює результат з оригіналом товару, повторює невдалі генерації і лише сумнівні випадки віддає людині. Продукт доступний для enterprise-клієнтів з оплатою за обсяг; для суворіших вимог є додаткова гарантія на кейси, які не проходять і після повторів.", "Найцікавіше — бенчмарк: на 4 250 згенерованих зображеннях для 850 реальних товарів (одяг, взуття, сумки, прикраси) найкращі моделі редагування проходили повну перевірку точності лише у 29% випадків, а логотипи спотворювалися в кожному пʼятому результаті. Власний Fidelity Layer Photoroom підняв показник до 38,2%. Інженери помітили, що повторні спроби без зміни моделі помітно покращують результат — звідси retry-цикл.", "Серед ранніх впроваджень: маркетплейс виконав понад 1,5 млн автоматичних перевірок за три тижні і виправив понад 90 тис. зображень; сервіс доставки їжі обробив 8 200 фото за ніч, з них 7 пішли рецензенту. Photoroom заявляє понад 7 млрд оброблених зображень на рік."], "means": "Photoroom (tier-2) рухається в enterprise-автоматизацію, де ми не конкуруємо, але його дані важливі: навіть найкращі моделі інпейнту спотворюють дрібні деталі й текст у більшості випадків. Для GenErase, GenSwap і GenExpand це аргумент за автоматичну перевірку результату й повторну генерацію під капотом, а не лише кнопку «ще варіант». Підхід «модель-роутер + перевірка + retry» можна перенести на наш хмарний пайплайн.", "importance": 3, "category": "comp", "media": {"kind": "none", "hero_image": null, "video": null}, "page": {"images": [{"uri": "img/f57a93124874.jpg", "w": 1000, "h": 564, "alt": ""}], "videos": []}}, {"id": "1e69c2c6ab", "source": "Yahoo Tech", "url": "https://tech.yahoo.com/cameras/articles/adobe-camera-raw-18-6-230720324.html", "date": "2026-09-01T23:07:20+00:00", "title": "Adobe Camera Raw 18.6: інструмент Glow з дифузією, bloom і галацією для RAW", "lead": "Adobe випустила Camera Raw 18.6 з новим інструментом Glow у панелі Effects: три плівкові стилі свічення — Diffusion, Bloom і Halation — застосовуються до RAW глобально або через маски. Також додано панель метаданих і інструмент Trim.", "full": ["Glow розташований у панелі Effects поруч із Vignette і Grain. Diffusion дає туманне пом'якшення на кшталт фільтрів Black Mist / Pro Mist, Bloom — м'яке свічення лише у світлах (тумани, водоспади), Halation — кольоровий ореол навколо яскравих країв і джерел світла, як на плівці. Є підналаштування Style, Range, Spread і Warmth; вони спільні для всього кадру, а маски (об'єкт, діапазон яскравості, область) керують лише силою ефекту.", "Нова панель Metadata Info показує камеру, об'єктив, розміри, дату, копірайт і Content Credentials прямо в робочому просторі. Інструмент Trim у Crop & Expand робить усе поза кадруванням прозорим (а не прихованим), що спрощує композитинг і працює в парі з Generative Expand на Firefly. Додано профілі нових камер і об'єктивів, зокрема Tamron 12-20mm F2.8 і анаморфних об'єктивів Reeflex для iPhone.", "Оновлення доступне через Creative Cloud. Glow поки що є лише в ACR і відсутній у Lightroom, але оглядачі очікують його появу там пізніше — так само, як раніше з видаленням відблисків."], "means": "Adobe додає плівкові ефекти на рівні RAW, які в Luminar Neo частково покриваються Film Grain, Vignette і Magic Light AI, але окремого дифузійного свічення з керуванням Bloom/Halation і теплотою в нас немає. Це недорогий у реалізації класичний ефект, який добре лягає в Presets і Layers та може працювати з Mask AI для локального застосування. Варто оцінити його і для Luminar Mobile як on-device фільтр.", "importance": 3, "category": "comp", "media": {"kind": "video", "hero_image": 0, "video": "Te1D8Nmal7I"}, "page": {"images": [{"uri": "img/74ae0a12d984.jpg", "w": 976, "h": 549, "alt": "Traditional Chinese pavilion with curved roof by a river at dusk, surrounded by illuminated modern skyscrapers; digital settings panel overlay visible in the foreground."}, {"uri": "img/e925960ee803.jpg", "w": 976, "h": 594, "alt": "A screenshot of Adobe Camera Raw 18.6 showing the new Metadata Info Panel on the right. The photo in the viewer is a modern office building with dark glass windows and geometric reflections, featuring the signs \"ROCK POINTE III\" and \"601 WASHINGTON\" on its facade against a blue sky."}], "videos": [{"yt": "Te1D8Nmal7I"}]}}, {"id": "bd711de89b", "source": "jetstream.blog", "url": "https://jetstream.blog/en/android-drop-september-2026/", "date": "2026-09-01T21:21:20+00:00", "title": "Android Drop вересня 2026: AI Enhance і Ask Photos у Google Photos, Nano Banana 2 у Messages", "lead": "Google 1 вересня випустив вересневий Android Drop з 11 функціями. Серед них — AI Enhance в одне натискання та AI-редагування Ask Photos у Google Photos, а також перехід функції Remix у Google Messages на модель Nano Banana 2.", "full": ["AI Enhance у Google Photos аналізує фото й одразу застосовує найефективніші корекції, включно з тонуванням кольору та кадруванням; функція доступна глобально всіма мовами. Ask Photos додає AI-редагування зображень через текстові запити прямо в застосунку Google Photos.", "Remix у Google Messages переходить на генеративну модель Nano Banana 2 з кращим рендерингом тексту та ширшими знаннями про світ — можна створювати запрошення чи постери з друзями, не виходячи з месенджера. Решта функцій дропу не стосуються фото: Find Hub запам'ятовує місця речей, Motion Assist зменшує заколисування на Android 17, у Gemini Live з'являється Guided vision для людей з порушеннями зору, Google Keep інтегрується в Messages."], "means": "AI Enhance у Google Photos — це безкоштовний on-device/хмарний аналог Enhance AI у Luminar Mobile, доступний сотням мільйонів Android-користувачів; це підвищує планку для нашої слабшої Android-версії. Ask Photos з редагуванням за текстом рухає Google Photos у бік розмовного редактора, що перетинається з Erase, Sky і Relight у Mobile. Nano Banana 2 в системних застосунках означає, що генеративна якість Google стає буденною для аудиторії.", "importance": 4, "category": "comp", "media": {"kind": "image", "hero_image": 0, "video": null}, "page": {"images": [{"uri": "img/1fcb2dfa5f7f.jpg", "w": 1000, "h": 562, "alt": ""}], "videos": []}}, {"id": "cfb11d71f7", "source": "9to5Google", "url": "https://9to5google.com/2026/09/01/google-pics-launch/", "date": "2026-09-01T16:00:00+00:00", "title": "Google Pics вийшов у Workspace: об'єктне AI-редагування на Nano Banana", "lead": "Google запустив Google Pics — редактор і генератор зображень на моделі Nano Banana, вбудований у Google Workspace (Docs, Slides, згодом Drive) і доступний на pics.new. Анонсований на I/O 2026, інструмент з 1 вересня доступний у загальному доступі.", "full": ["Pics пропонує «точне об'єктне редагування»: сегментація дозволяє виділити окремий об'єкт у зображенні й змінити тільки його, залишивши решту недоторканою. Інструкції задаються текстовими коментарями прямо на зображенні, кілька правок можна виконати одночасно й легко відкотити. Окремо редагується і навіть перекладається текст у зображенні зі збереженням дизайну та шрифту; є кадрування під web, соцмережі та друк.", "Редактор відкривається як оверлей при кліку на зображення в Docs або Slides, підтримує імпорт з комп'ютера, Google Drive і Google Photos, спільну роботу за посиланням і генерацію кількох варіантів з одного промпта. Google позиціонує продукт для бізнес-задач: локалізація соцмережевих і рекламних матеріалів, розміщення продуктів у різних контекстах, флаєри та мерч.", "Доступність: тарифи Workspace Business Standard, Business Plus, Enterprise Standard і Enterprise Plus з 1 вересня, а також підписники Google AI Pro та Ultra протягом найближчих тижнів. Оглядачі порівнюють Pics із Canva й Adobe Express і зауважують, що це інструмент «промпт замість дизайну», а не покращення Google Photos."], "means": "Google робить Nano Banana масовим інструментом об'єктного редагування з мультиредагуванням і сегментацією — це прямий аналог зв'язки Mask AI + GenSwap/GenErase у Luminar Neo, але з текстовим керуванням. Для Luminar Mobile важливо, що імпорт іде прямо з Google Photos і що рівень «виділив об'єкт — описав правку» стає базовим очікуванням користувача. Варто відстежувати ліміти генерацій і розширення Pics на Google Photos.", "importance": 4, "category": "comp", "media": {"kind": "video", "hero_image": 0, "video": "1LYsbVfwgzA"}, "page": {"images": [{"uri": "img/d038b7cbc3c9.jpg", "w": 1000, "h": 562, "alt": ""}, {"uri": "img/6ed15d7ea5b5.jpg", "w": 1000, "h": 523, "alt": ""}], "videos": [{"yt": "1LYsbVfwgzA"}]}}, {"id": "90841e6fe8", "source": "آي-فون إسلام", "url": "https://iphoneislam.com/language/en/2026/07/our-experience-with-the-clean-up-tool-in-the-ios-27-beta-apples-ai-photo-editing-is-finally-worth-using-but/169466", "date": "2026-09-01T15:27:50+00:00", "title": "Clean Up в iOS 27 beta: швидше, точніше, з режимами Fast і High Quality", "lead": "У developer beta iOS 27 інструмент Clean Up у Photos отримав помітно кращий генеративний заповнювач і два режими роботи — Fast і High Quality. Оглядачі iPhone Islam кажуть, що видалення об'єктів нарешті придатне для щоденного використання.", "full": ["За тестами, Clean Up став швидше й точніше розпізнавати елементи для видалення, краще працює зі світлом і тінями. Порівняно з iOS 26, де на місці видалених об'єктів залишалися розмиті плями й нерівномірні кольори, у iOS 27 алгоритм реконструює фон, розуміючи його загальний патерн, і результат виглядає природно.", "Нова опція — вибір між режимом Fast (правка за долі секунди для швидкого шерингу) та High Quality (довша, але точніша попіксельна обробка для друку). Автори зазначають, що на етапі бети є «серйозна перешкода» щодо продуктивності й сумісності пристроїв, яка може стримувати повне використання інструмента."], "means": "Apple підтягує вбудований Clean Up до рівня, який раніше був перевагою окремих редакторів, — це прямий тиск на Erase у Luminar Mobile для iOS, де користувач тепер має безкоштовний on-device варіант із режимом високої якості. Нам варто чітко відрізнятися якістю на складних фонах і генеративним GenErase, а також розглянути аналогічний вибір «швидко/якісно» як UX-патерн для хмарної обробки.", "importance": 3, "category": "comp", "media": {"kind": "gallery", "hero_image": 0, "video": null}, "page": {"images": [{"uri": "img/28558633cfcf.jpg", "w": 1000, "h": 563, "alt": "Testing the Clean Up tool in iOS 27"}, {"uri": "img/7568d042c2bd.jpg", "w": 1000, "h": 562, "alt": ""}, {"uri": "img/325bcb906b74.jpg", "w": 768, "h": 384, "alt": "From the Phonegram website: In the first image, a man is shown outdoors holding a card to his eye; in the next two images, face distortion effects have been applied using iOS 27 and iOS 26, highlighting the improved capabilities of the 'Clean Up' tool in iOS 27 for creative photo editing."}, {"uri": "img/f60488c977ec.jpg", "w": 768, "h": 512, "alt": "From the Phonegram website: Three side-by-side images show a hand holding an orange phone, a distorted hand, and an empty hand; with labels 'Original Image', 'iOS 26', and 'iOS 27' under the heading 'Clean Up Tool'. The last image highlights how the Clean Up tool in iOS 27 provides more accurate results when removing elements from photos."}, {"uri": "img/3933df29deac.jpg", "w": 1000, "h": 562, "alt": "From the Phonegram website: A hand holding two smartphones displaying photos of the same man; one photo shows him wearing sunglasses, and the other without, highlighting the stunning results achieved using the Clean Up tool in iOS 27."}], "videos": []}}, {"id": "f49774b943", "source": "Fstoppers", "url": "https://fstoppers.com/apps/dxo-releases-photolab-10-depth-masks-advanced-color-grading-and-new-ai-tools-904420", "date": "2026-09-01T13:03:01+00:00", "title": "DxO PhotoLab 10: маски глибини, сегментація обличчя, кольорове колесо та зв'язка з Affinity", "lead": "DxO випустила PhotoLab 10 з новими Depth Masks на основі AI-карти глибини, сегментацією облич, масками для кожної людини окремо, єдиним колесом колорграду та кнопкою передачі зображення в Affinity. Довічна ліцензія коштує $249.99, апгрейд з версій 8–9 — $129.99.", "full": ["Depth Masks будують карту глибини з будь-якого файлу без вбудованих даних глибини й дозволяють локально редагувати передній, середній або задній план; межі уточнюються повзунками й розтушовкою. AI Masks тепер розпізнають кожну людину окремо (спільна маска, група або індивідуальні маски), а сегментація обличчя додає брови, очі, райдужку і зіницю, склеру, зуби, волосся на обличчі, шкіру та губи до наявних категорій (небо, суб'єкт, фон, тварини, квіти, транспорт). AI-маски можна уточнювати піпеткою U Point за кольором і яскравістю.", "Новий інструмент Color Grading зібраний навколо одного колеса з незалежним керуванням тінями, середніми тонами, світлами й балансом; правки можна зв'язувати між тональними діапазонами. Додано Control Brush, еліптичні контрольні точки, автоматичне видалення сенсорного пилу на рівні RAW, кадрування «як знято», покращення бібліотеки. Оновлення шумозаглушення немає — використовується той самий DeepPRIME, що й у PureRAW 6. Генеративних функцій, заміни неба чи генеративного видалення в PhotoLab, як і раніше, немає.", "Кнопка Affinity відкриває зображення для попіксельної ретуші й композитингу з поверненням результату в PhotoLab — DxO називає це першим кроком інтеграції. Оглядачі підкреслюють, що зв'язка DxO + Affinity утворює повний RAW-to-pixel робочий процес без підписки, а Fstoppers окремо порівнює Depth Masks із «регулюванням світла за глибиною» в Luminar Neo, відзначаючи більшу гнучкість DxO. Доступна 7-денна пробна версія."], "means": "DxO виходить на нашу територію: Depth Masks за AI-картою глибини прямо конкурують із Relight AI і Bokeh AI, а посегментна маска обличчя (райдужка, склера, зуби, губи) деталізованіша за наші Face AI/Skin AI та Mask AI. Водночас у PhotoLab немає Sky AI, GenErase та інших генеративних інструментів — це наша перевага в позиціюванні. Зв'язка «довічна ліцензія + Affinity» цілить у ту ж аудиторію, що тримає Luminar другим редактором поруч із Lightroom.", "importance": 4, "category": "comp", "media": {"kind": "gallery", "hero_image": 0, "video": null}, "page": {"images": [{"uri": "img/2f7f791a5416.jpg", "w": 1000, "h": 565, "alt": "Screenshot of DxO photo editing software displaying a desert landscape at sunset"}, {"uri": "img/f3812075d32f.jpg", "w": 960, "h": 900, "alt": "Before and after color grading comparison of male portrait with warm skin tones"}, {"uri": "img/99f3721fa237.jpg", "w": 993, "h": 665, "alt": "Screenshot showing a custom mask creator interface overlaid on a beach photo of two women in water and a green-screen figure."}, {"uri": "img/d19868cebbf4.jpg", "w": 1000, "h": 596, "alt": "Woman with black blunt bangs and closed eyes wearing bright green lipstick against pink background"}, {"uri": "img/6d3613cf8415.jpg", "w": 1000, "h": 564, "alt": "Illustration of a bright green and white striped zebra against a blurred natural background"}, {"uri": "img/d149d3651220.jpg", "w": 960, "h": 900, "alt": "Screenshot showing before and after comparison of cityscape photo editing with spot removal and desaturation controls"}, {"uri": "img/588254ab0a80.jpg", "w": 1000, "h": 542, "alt": "Screenshot of Local Adjustments panel in photo editing software with red rock formations at sunset"}], "videos": []}}, {"id": "740adb9e4f", "source": "Notebookcheck", "url": "https://www.notebookcheck.net/New-free-open-source-video-editor-update-brings-offline-AI-subject-masking-and-pro-color-scopes.1383937.0.html", "date": "2026-08-31T13:37:00+00:00", "title": "OpenShot 4.0: офлайн AI-маскування об'єктів на YOLO, EfficientSAM і Cutie", "lead": "Вийшов безкоштовний відеоредактор OpenShot 4.0 (GPLv3) для Windows, macOS і Linux. Серед нових ефектів — Object Mask, що будує анімовану маску навколо об'єкта за кількома точками повністю локально, без хмари й акаунта.", "full": ["Object Mask використовує мережі YOLO, EfficientSAM і Cutie, конвертовані в ONNX і завантажувані за потреби; користувач ставить кілька позитивних і негативних точок, а маска трекається по кадрах. Уся обробка відбувається на пристрої. Серед десяти нових ефектів також Denoise Image, Film Grain, Glow, Shadow, Displacement Map і Color Grade.", "Новий Color View об'єднує колірні кола для глобального, тіньового, середнього та світлого діапазонів, чотири криві, підтримку .cube LUT з регулюванням інтенсивності та скопи: waveform, гістограму, RGB parade і vectorscope з лінією шкірних тонів. Таймлайн переписано на нативний Qt, а Recording View дозволяє записувати екран, вебкамеру й мікрофон одразу в проєкт."], "means": "Це референс для Mask AI і Erase: зв'язка EfficientSAM + Cutie в ONNX показує, що інтерактивне маскування за кліками з трекінгом можна робити повністю на пристрої в open-source продукті. Для Luminar Mobile, де Erase і Portrait частково залежать від хмари, EfficientSAM під Core ML/NNAPI — реальний кандидат на локальний вибір об'єкта. GPLv3 не дозволяє брати код напряму, але самі моделі мають окремі ліцензії й їх варто перевірити.", "importance": 3, "category": "ai", "media": {"kind": "image", "hero_image": 0, "video": null}, "page": {"images": [{"uri": "img/a8e122e26fac.jpg", "w": 1000, "h": 750, "alt": ""}], "videos": []}}, {"id": "217d1c8bcc", "source": "Adobe Newsroom", "url": "https://news.adobe.com/news/2026/08/adobe-mcit-and-humain-expand-partnership", "date": "2026-08-31T08:23:23+00:00", "title": "Adobe дає 27 млн жителів Саудівської Аравії рік безкоштовного Firefly та Express", "lead": "На LEAP 2026 Adobe, MCIT і HUMAIN розширили партнерство: понад 27 млн жителів Саудівської Аравії від 13 років отримають 12 місяців безкоштовного Firefly Standard і Express Premium. Adobe оцінює зобов'язання в понад $4 млрд.", "full": ["Разом із доступом до інструментів HUMAIN і Adobe готують спільну модель генерації зображень на базі Adobe Firefly Foundry, налаштовану на саудівську культуру та арабськомовні промпти. Це перша модель зображень, створена з Firefly Foundry для стороннього партнера.", "Adobe також запустила підтримку сучасної стандартної арабської з письмом справа наліво в Adobe Express на десктопі, вебі та iOS глобально, включно з типографікою, редагуванням тексту та UI. Стартапи з програм MCIT (CODE, The Garage) отримають рік безкоштовних інструментів і навчання з початку 2027 року, а Adobe Digital Academy займатиметься перекваліфікацією."], "means": "Для Luminar це ринковий сигнал: Adobe масово роздає безкоштовний Firefly з генерацією і редагуванням на цілий регіон, знижуючи планку очікуваної ціни за генеративні фічі на кшталт GenErase/GenSwap. Якщо MENA є в наших планах для Luminar Mobile, конкурувати за платну підписку там буде важче ще принаймні рік. Локалізовані під культуру моделі та RTL-підтримка — нагадування, що арабська локалізація UI та пресетів досі є прогалиною.", "importance": 2, "category": "market", "media": {"kind": "image", "hero_image": 0, "video": null}, "page": {"images": [{"uri": "img/279f2c98c55d.jpg", "w": 1000, "h": 700, "alt": ""}, {"uri": "img/98a1f1a944c3.jpg", "w": 750, "h": 362, "alt": ""}, {"uri": "img/46ed20ce2805.jpg", "w": 750, "h": 971, "alt": ""}, {"uri": "img/2d2b4b98899a.jpg", "w": 750, "h": 938, "alt": ""}, {"uri": "img/1725e6bbefbd.jpg", "w": 750, "h": 429, "alt": ""}, {"uri": "img/28916cdcbcff.jpg", "w": 750, "h": 429, "alt": ""}, {"uri": "img/ef628c24e806.jpg", "w": 750, "h": 421, "alt": ""}], "videos": []}}, {"id": "f49ce3b33a", "source": "digitalcameraworld.com", "url": "https://www.digitalcameraworld.com/photography/photo-editing/we-speak-to-thousands-of-photographers-every-year-how-capture-one-builds-the-future-of-professional-workflows-by-providing-technology-that-almost-seems-to-melt-away", "date": "2026-08-30T03:22:43+00:00", "title": "CEO Capture One: тисячі розмов із фотографами й тетеринг Hasselblad до кінця року", "lead": "Digital Camera World опублікував інтерв'ю з CEO Capture One Рафаелем Ортою про те, як компанія будує продукт через студійні візити та події, і підтвердив тетеринг для камер Hasselblad до кінця 2026 року.", "full": ["Орта наголошує, що Capture One щороку спілкується з тисячами фотографів — на виставках, у школах і безпосередньо в студіях (наприклад, нещодавні візити в Париж), і саме ці розмови формують роадмап. Ключовим елементом досвіду він називає тетеринг: підключена до робочої станції камера залучає до зйомки всю команду.", "Компанія має близько 122 співробітників у Данії, Греції, Лондоні та США і зосереджена на комерційній, fashion- і рекламній фотографії. Обіцяний тетеринг Hasselblad фокусується на швидкості передачі файлів, надійності та стабільності з'єднання."], "means": "Прямого впливу на фічі Luminar Neo немає: Capture One закріплюється в професійній студійній ніші, куди ми не йдемо. Корисний як контекст позиціонування — їхня ставка на тетеринг і «невидиму технологію» протилежна нашій ставці на AI-інструменти на кшталт Enhance AI і Sky AI для ентузіастів.", "importance": 2, "category": "comp", "media": {"kind": "image", "hero_image": 0, "video": null}, "page": {"images": [{"uri": "img/15e099c0bba3.jpg", "w": 1000, "h": 562, "alt": ""}], "videos": []}}, {"id": "9288b43d59", "source": "nerdbot", "url": "https://nerdbot.com/2026/08/28/picsart-wants-to-build-you-an-influencer-without-ever-showing-your-face/", "date": "2026-08-28T09:53:12+00:00", "title": "Picsart Persona: генератор постійного AI-персонажа для «безликих» креаторів", "lead": "Picsart (130 млн MAU) просуває Persona — інструмент, що створює персонажа за обраним «вайбом», анімує його у короткі відео для TikTok, Reels і Shorts і дозволяє повторно використовувати той самий образ у нових сценах.", "full": ["Персонаж стартує з одного дизайну: замість порожнього промпта користувач обирає готову естетику, а далі змінює вбрання й сцену через image-to-image, зберігаючи обличчя й пропорції. Підтримуються реалістичні люди з деталями шкіри, тварини, фентезі-істоти та маскоти. Запущено на початку березня 2026 року.", "Під капотом Picsart автоматично маршрутизує кожен запит до найбільш підхожої відеомоделі, серед яких Veo 3.1 і Kling 3.0. Компанія цілиться в ринок інфлюенс-маркетингу ($40 млрд) і малий бізнес, якому потрібна регулярна присутність без камери."], "means": "Для Luminar Mobile це приклад, як tier-2 конкурент іде від редагування фото до генерації контенту з консистентним персонажем через оркестрацію сторонніх моделей. Технічно цікава саме консистентність ідентичності при image-to-image — те, що потрібно було б GenSwap для заміни людей у кадрі. Прямої загрози фоторедагуванню немає, але показує, куди Picsart веде аудиторію соцмереж.", "importance": 2, "category": "comp", "media": {"kind": "gallery", "hero_image": 0, "video": null}, "page": {"images": [{"uri": "img/2478f9f0338b.jpg", "w": 634, "h": 360, "alt": ""}, {"uri": "img/54c744cee4e4.jpg", "w": 788, "h": 306, "alt": ""}, {"uri": "img/886debf38a91.jpg", "w": 788, "h": 256, "alt": ""}], "videos": []}}, {"id": "65f86a28f0", "source": "Adobe", "url": "https://blog.adobe.com/en/publish/2026/08/27/new-photoshop-innovations-bring-you-more-choice-control-at-every-stage-of-your-creative-process", "date": "2026-08-27T07:00:00+00:00", "title": "Adobe оновила Photoshop: AI Assisted Editor, Light Adjustment Layer, Markup", "lead": "27 серпня Adobe випустила великий апдейт Photoshop: новий шар Light Adjustment Layer із Camera Raw-контролями, Instruct Edit with Masks на Firefly Image 5, інструмент Markup для «малювання» правок і окремий бета-режим AI Assisted Editor для промпт-редагування.", "full": ["Light Adjustment Layer — новий недеструктивний коригувальний шар з повзунками Exposure, Contrast, Highlights, Shadows, Whites і Blacks; Adobe обіцяє результат рівня Camera Raw без виходу зі звичного шарового воркфлоу Photoshop. Instruct Edit with Masks на базі Firefly Image 5 розуміє контекст усього зображення: користувач текстом описує точну правку (відкрити закриті очі, надіти капелюх на конкретну людину), а незамасковані зони, як-от обличчя чи логотипи, лишаються недоторканими.", "Markup дозволяє показати моделі бажаний результат прямо на зображенні: виділити ділянку для перефарбування, намалювати стрілку для позиціювання чи грубо накидати форму нового об'єкта, що зменшує неоднозначність текстових промптів. Також Dynamic Text тепер працює з будь-якою фігурою чи контуром, а панель Adobe Stock з 900+ млн ассетів вбудована в Photoshop як докована панель.", "AI Assisted Editor (бета) — окремий простір з рядком природномовних промптів і набором генеративних інструментів: Prompt to Edit, Remove Background, Generative Expand, Remove Tool, Generative Fill, Generative Upscale та AI Markup, на базі «провідних AI-моделей». Prompt to Edit доступний і в Pro Editor через Contextual Task Bar: він змінює все зображення без виділення, а кожен результат стає генеративним шаром. Усе, крім бети AI Assisted Editor, доступне з сьогоднішнього дня."], "means": "Це прямий удар по нашій ніші «простого редактора»: AI Assisted Editor прибирає складність Photoshop і дає новачкам Remove/Expand/Upscale/Prompt-режим — тобто аналог Erase, GenExpand, Upscale AI та GenSwap в одному вікні. Markup і Instruct Edit with Masks задають нову планку для GenErase/GenSwap: локальні правки за грубим ескізом плюс захист незамаскованих зон — варто оцінити подібний UX для Mask AI + генеративних інструментів. Light Adjustment Layer закриває одну з причин тримати другий редактор поруч із Photoshop.", "importance": 5, "category": "comp", "media": {"kind": "image", "hero_image": 0, "video": null}, "page": {"images": [{"uri": "img/44cb3dd9f643.jpg", "w": 750, "h": 329, "alt": "Image of AI Assisted Pro Editor"}, {"uri": "img/7694b2d3df2e.jpg", "w": 1000, "h": 562, "alt": ""}, {"uri": "img/f6826b723331.jpg", "w": 750, "h": 422, "alt": "Image of Firefly Image 5 (Preview)"}], "videos": []}}, {"id": "fd6e940290", "source": "Lightroom Queen", "url": "https://www.lightroomqueen.com/acr-new-features/", "date": "2026-08-25T17:36:17+00:00", "title": "Adobe перевела Camera Raw на щомісячні релізи: нові фічі з'являються раніше за Lightroom", "lead": "Lightroom Queen пояснює: Camera Raw тепер оновлюється щомісяця, тоді як Lightroom залишається на приблизно двомісячному циклі, тож нові інструменти редагування з'являються в ACR на тижні або місяці раніше.", "full": ["Camera Raw і Lightroom мають спільний двигун редагування, але нові функції — AI-інструменти, покращення масок, нові коригування — розробляються спочатку в Camera Raw, який має вужчу роль (проявка всередині Photoshop і Bridge). Lightroom має більше залежностей (Classic, Desktop, Mobile, web), тому його релізи готуються довше.", "Adobe планує переносити функції з ACR у Lightroom, але без гарантії, що це буде в найближчому релізі; деякі фічі потребують доопрацювання або взагалі не потрапляють у Lightroom. Щомісячні релізи ACR також першими отримують підтримку нових камер і об'єктивів."], "means": "Для конкурентної розвідки це означає, що майбутні фічі Lightroom треба відстежувати за релізами Camera Raw — там вони з'являються на 1–2 місяці раніше. Це дає команді Luminar Neo більше часу оцінити, чи перетинається новинка з Mask AI, Noiseless AI або Relight AI, і підготувати відповідь до того, як фіча дійде до масової аудиторії Lightroom.", "importance": 2, "category": "comp", "media": {"kind": "none", "hero_image": null, "video": null}, "page": {"images": [{"uri": "img/43e0c23b02f5.jpg", "w": 708, "h": 708, "alt": ""}], "videos": []}}, {"id": "8730cf2427", "source": "Apple", "url": "https://www.apple.com/newsroom/2026/08/apple-unveils-a-more-powerful-mac-mini-featuring-the-all-new-m6-and-m5-pro/", "date": "2026-08-25T07:00:00+00:00", "title": "Apple представила Mac mini на M6 і M5 Pro: до 2,1x швидша обробка зображень", "lead": "Apple анонсувала Mac mini з новими чипами M6 (від $899) і M5 Pro (від $1699); передзамовлення з 25 серпня, поставки з 22 вересня. Apple заявляє суттєвий приріст у LLM-обробці та роботі з зображеннями.", "full": ["За даними Apple, Mac mini з M6 обробляє LLM-промпти в LM Studio до 13,5x швидше, ніж M1, і до 4,8x швидше за M4. Версія з M5 Pro дає до 8,5x швидшу LLM-обробку проти M2 Pro (4x проти M4 Pro), до 4,5x швидший рендер у Blender і до 2,1x швидшу обробку зображень в Affinity порівняно з M2 Pro (1,5x проти M4 Pro).", "Новинки виходять разом із публічною бетою macOS 27 Golden Gate, фінальний реліз якої запланований на осінь. Пристрої доступні в 30 країнах; освітні ціни — $799 та $1599 відповідно."], "means": "Нове покоління Apple Silicon підвищує стелю для on-device обробки: важкі моделі Noiseless AI, Upscale AI, Supersharp AI і майбутні локальні генеративні пайплайни на Core ML отримають більший запас продуктивності. Варто перевірити Luminar Neo на M6/M5 Pro та macOS 27 до вересневого старту продажів і оновити бенчмарки — Apple у своїх матеріалах порівнює саме швидкість обробки зображень у Affinity, а не в Luminar.", "importance": 2, "category": "market", "media": {"kind": "image", "hero_image": 0, "video": null}, "page": {"images": [{"uri": "img/ac8d98a0caf1.jpg", "w": 1000, "h": 666, "alt": "A person’s hand holds the silver Mac mini, showing its front ports."}, {"uri": "img/84bd58654590.jpg", "w": 1000, "h": 525, "alt": ""}, {"uri": "img/d719ddffce27.jpg", "w": 1000, "h": 666, "alt": "An overhead view of a person using a keyboard and mouse at a desk, with a Mac mini connected to a large display."}, {"uri": "img/744399fc2ac0.jpg", "w": 1000, "h": 562, "alt": "The Apple M6 chip logo on a blue and purple gradient background."}, {"uri": "img/0492b0738bd4.jpg", "w": 1000, "h": 666, "alt": "Mac mini with M6 is shown with a display running Perplexity."}, {"uri": "img/05cd34c0de87.jpg", "w": 1000, "h": 666, "alt": "Mac mini with M6 is shown with a display running video editing software."}], "videos": []}}];

const MONTHS=['січ','лют','бер','кві','тра','чер','лип','сер','вер','жов','лис','гру'];
const DAYS_UK=['Неділя','Понеділок','Вівторок','Середа','Четвер','Пʼятниця','Субота'];
function fmtDate(iso){const d=new Date(iso);return `${d.getDate()} ${MONTHS[d.getMonth()]}`}
function dayLabel(iso){const d=new Date(iso),t=new Date();const diff=Math.floor((t.setHours(0,0,0,0)-new Date(d).setHours(0,0,0,0))/864e5);
  const s=`${d.getDate()} ${['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'][d.getMonth()]}`;
  return diff===0?`Сьогодні, ${s}`:diff===1?`Вчора, ${s}`:`${DAYS_UK[d.getDay()]}, ${s}`}
function img(src,alt){return `<img class="art" src="${src}" alt="${(alt||'').replace(/"/g,'&quot;')}" loading="lazy">`}
function media(it){
  const m=it.media,P=it.page,imgs=P.images;let inner='',kind='';
  const hero=(m.hero_image!=null&&imgs[m.hero_image])?imgs[m.hero_image]:imgs[0];
  if(m.kind==='video'&&m.video){
    const poster=hero?img(hero.uri):`<div class="art" style="background:#1a1b1e"></div>`;
    inner=`<a class="vlink" href="https://www.youtube.com/watch?v=${m.video}" target="_blank" rel="noopener">${poster}<div class="play"><i></i></div></a>`;kind='Відео';
  }else if(m.kind==='gallery'&&imgs.length>=3){
    const rest=imgs.filter(x=>x!==hero).slice(0,2);
    inner=`<div class="gal">${img(hero.uri)}${img(rest[0].uri)}<div class="more">${imgs.length>3?`+${imgs.length-3}`:''}${img(rest[1].uri)}</div></div>`;kind='Галерея';
  }else if(hero){inner=img(hero.uri,hero.alt);kind='Зображення'}
  else return '';
  return `<div class="media" style="aspect-ratio:${hero&&hero.w/hero.h<1.2?'4/3':'16/9'}">${inner}</div>`;
}
function thumbs(it){
  const P=it.page,m=it.media;const used=new Set([m.hero_image]);
  const rest=P.images.map((x,i)=>({...x,i})).filter(x=>!used.has(x.i)).slice(0,4);
  const vids=P.videos.filter(v=>v.yt&&v.yt!==m.video).slice(0,2);
  if(!rest.length&&!vids.length) return '';
  return `<div class="thumbs">${rest.map(x=>`<a href="${x.uri}" target="_blank" rel="noopener"><img src="${x.uri}" alt="${(x.alt||'').replace(/"/g,'&quot;')}" loading="lazy"></a>`).join('')}${vids.map(v=>`<a href="https://www.youtube.com/watch?v=${v.yt}" target="_blank" rel="noopener" class="vt"><span>▶ YouTube</span></a>`).join('')}</div>`;
}
const COPY='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
function post(it,showDay){
  const c=CATS[it.category]||CATS.market;
  return `${showDay?`<div class="daysep">${dayLabel(it.date)}</div>`:''}
  <article id="${it.id}" class="post ${it.importance>=5?'big':''} ${state.open.has(it.id)?'open':''}" data-id="${it.id}">
    <div class="head"><span class="src"><i>${it.source.replace(/[^A-Za-z0-9]/g,'').slice(0,2)||'··'}</i>${it.source}</span><span>${fmtDate(it.date)}</span><span class="cat" style="--c:${c.c}">${c.n}</span><span class="imp ${it.importance>=4?'hi':''}">${it.importance}/5 · ${IMPN[it.importance]}</span></div>
    <h3 class="title">${it.title}</h3>
    ${media(it)}
    <p class="lead">${it.lead}</p>
    <div class="detail">
      ${it.full.map(p=>`<p class="full">${p}</p>`).join('')}
      ${thumbs(it)}
      <span class="lab">Що це означає для Luminar<em>чернетка AI</em></span>
      <p class="means">${it.means}</p>
    </div>
    <div class="foot"><button class="more">${state.open.has(it.id)?'Згорнути':'Детальніше'}</button><button class="copy">${COPY}Копіювати</button><a class="src-link" href="${it.url}" target="_blank" rel="noopener">Джерело ↗</a></div>
  </article>`;
}
let shown=20;
function render(){
  const list=ITEMS.slice(0,shown);let last='';
  document.getElementById('feed').innerHTML=list.map(it=>{const d=it.date.slice(0,10);const s=d!==last;last=d;return post(it,s)}).join('')
   +(shown<ITEMS.length?`<button class="btn loadmore">Завантажити ще (${ITEMS.length-shown})</button>`:'');
}
document.getElementById('feed').addEventListener('click',e=>{
  if(e.target.closest('.loadmore')){shown+=20;render();return}
  const sl=e.target.closest('.copy');
  if(sl){
    const it=ITEMS.find(x=>x.id===sl.closest('.post').dataset.id); if(!it) return;
    const txt=location.origin+location.pathname+'#'+it.id;
    const done=ok=>{sl.innerHTML=COPY+(ok?'Скопійовано':'Не вдалось');setTimeout(()=>{sl.innerHTML=COPY+'Копіювати'},1800)};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>done(true),()=>done(false))}
    else{const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}ta.remove();done(ok)}
    return;
  }
  const m=e.target.closest('.more'); if(!m) return;
  const id=m.closest('.post').dataset.id;
  state.open.has(id)?state.open.delete(id):state.open.add(id); render();
});
function openFromHash(){
  const id=decodeURIComponent(location.hash.slice(1)); if(!id) return;
  const idx=ITEMS.findIndex(x=>x.id===id); if(idx<0) return;
  if(idx>=shown) shown=idx+1;          // підвантажити до потрібного поста
  state.open.add(id); render();
  const el=document.getElementById(id); if(!el) return;
  el.scrollIntoView({block:'start'}); el.classList.add('hl'); setTimeout(()=>el.classList.remove('hl'),2000);
}
window.addEventListener('hashchange',openFromHash);
render(); openFromHash();
</script>
