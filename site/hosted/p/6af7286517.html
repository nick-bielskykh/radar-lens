<script>
const CATS={comp:{n:'Конкуренти',c:'#4c7bd9'},ai:{n:'AI-моделі',c:'#b04fd0'},algo:{n:'Алгоритми',c:'#2e9b8a'},market:{n:'Ринок',c:'#c9781a'}};
document.documentElement.lang='uk';
const SINGLE=true;
const ITEMS=[{"id": "6af7286517", "source": "IT Brief UK", "url": "https://itbrief.co.uk/story/photoroom-launches-visual-agents-for-enterprise-catalogues", "date": "2026-09-02T08:46:00+00:00", "title": "Photoroom запускає Visual Agents для каталогів: моделі проходять перевірку лише у 29% випадків", "lead": "Photoroom представив Visual Agents — корпоративну систему, яка автоматизує AI-генерацію товарних фото й відео з перевіркою точності та повторними спробами, і оприлюднив бенчмарк точності моделей редагування.", "full": ["Visual Agents будує пайплайн навколо вхідних каталожних зображень: обирає модель редагування під задачу, порівнює результат з оригіналом товару, повторює невдалі генерації і лише сумнівні випадки віддає людині. Продукт доступний для enterprise-клієнтів з оплатою за обсяг; для суворіших вимог є додаткова гарантія на кейси, які не проходять і після повторів.", "Найцікавіше — бенчмарк: на 4 250 згенерованих зображеннях для 850 реальних товарів (одяг, взуття, сумки, прикраси) найкращі моделі редагування проходили повну перевірку точності лише у 29% випадків, а логотипи спотворювалися в кожному пʼятому результаті. Власний Fidelity Layer Photoroom підняв показник до 38,2%. Інженери помітили, що повторні спроби без зміни моделі помітно покращують результат — звідси retry-цикл.", "Серед ранніх впроваджень: маркетплейс виконав понад 1,5 млн автоматичних перевірок за три тижні і виправив понад 90 тис. зображень; сервіс доставки їжі обробив 8 200 фото за ніч, з них 7 пішли рецензенту. Photoroom заявляє понад 7 млрд оброблених зображень на рік."], "means": "Photoroom (tier-2) рухається в enterprise-автоматизацію, де ми не конкуруємо, але його дані важливі: навіть найкращі моделі інпейнту спотворюють дрібні деталі й текст у більшості випадків. Для GenErase, GenSwap і GenExpand це аргумент за автоматичну перевірку результату й повторну генерацію під капотом, а не лише кнопку «ще варіант». Підхід «модель-роутер + перевірка + retry» можна перенести на наш хмарний пайплайн.", "importance": 3, "category": "comp", "media": {"kind": "none", "hero_image": null, "video": null}, "page": {"images": [{"uri": "/img/f57a93124874.jpg", "w": 1000, "h": 564, "alt": ""}], "videos": []}}];
let state={open:new Set(SINGLE?ITEMS.map(x=>x.id):[])};
if(SINGLE) document.getElementById('back').hidden=false;
const IMPN=['','фон','варто знати','важливо','дуже важливо','критично'];
const MONTHS=['січ','лют','бер','кві','тра','чер','лип','сер','вер','жов','лис','гру'];
const DAYS_UK=['Неділя','Понеділок','Вівторок','Середа','Четвер','Пʼятниця','Субота'];
function fmtDate(iso){const d=new Date(iso);return `${d.getDate()} ${MONTHS[d.getMonth()]}`}
function dayLabel(iso){const d=new Date(iso),t=new Date();const diff=Math.floor((t.setHours(0,0,0,0)-new Date(d).setHours(0,0,0,0))/864e5);
  const s=`${d.getDate()} ${['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'][d.getMonth()]}`;
  return diff===0?`Сьогодні, ${s}`:diff===1?`Вчора, ${s}`:`${DAYS_UK[d.getDay()]}, ${s}`}
const COPY='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
function img(src,alt){return `<img class="art" src="${src}" alt="${(alt||'').replace(/"/g,'&quot;')}" loading="lazy">`}
function linkify(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/(https?:\/\/\S+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/(^|\s)@(\w{1,15})/g,'$1<a href="https://x.com/$2" target="_blank" rel="noopener">@$2</a>')}
function fmtN(n){return n==null?'':n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(n>=1e4?0:1)+'K':String(n)}
function tweetCard(it){
  const w=it.tweet,imgs=it.page.images,m=it.media;
  const hero=(m.hero_image!=null&&imgs[m.hero_image])?imgs[m.hero_image]:imgs[0];
  const stats=[w.views!=null?`${fmtN(w.views)} переглядів`:'',w.likes!=null?`${fmtN(w.likes)} вподобань`:'',w.reposts!=null?`${fmtN(w.reposts)} репостів`:''].filter(Boolean).join(' · ');
  return `<div class="tw">
    <a class="who" href="https://x.com/${w.handle}" target="_blank" rel="noopener">${w.avatar?`<img src="${w.avatar}" alt="" loading="lazy" onerror="this.remove()">`:'<span class="av"></span>'}<div><b>${w.name}</b><span>@${w.handle}</span></div><span class="x">𝕏</span></a>
    <p class="txt">${linkify(w.text)}</p>
    ${hero?`<div class="media">${img(hero.uri,hero.alt)}</div>`:''}
    <div class="meta"><a href="${it.url}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">${fmtDate(it.date)}</a>${stats?`<span>${stats}</span>`:''}</div>
  </div>`;
}
function media(it){
  const m=it.media,P=it.page,imgs=P.images;let inner='',kind='';
  const hero=(m.hero_image!=null&&imgs[m.hero_image])?imgs[m.hero_image]:imgs[0];
  if(m.kind==='video'&&m.video){
    const poster=hero?img(hero.uri):`<div class="art" style="background:#1a1b1e"></div>`;
    inner=`<a class="vlink" href="https://www.youtube.com/watch?v=${m.video}" target="_blank" rel="noopener">${poster}<div class="play"><i></i></div></a>`;kind='Відео';
  }else if(hero){const hi=imgs.indexOf(hero);inner=`<button class="lb-open" data-i="${hi}">${img(hero.uri,hero.alt)}</button>`+(hero.generated?'<span class="srcnote">ілюстрація AI</span>':'');kind='Зображення'}
  else return '';
  // короб під пропорції картинки: нічого не ріжемо; дуже вертикальні/панорамні — вписуємо цілком
  let ratio=hero?hero.w/hero.h:16/9, fit=false;
  if(kind==='Відео') ratio=16/9;
  else if(ratio<0.9){ratio=0.9;fit=true} else if(ratio>2.2){ratio=2.2;fit=true}
  const light=/^arXiv/.test(it.source)&&kind==='Зображення'; if(light) fit=true;
  return `<div class="media${fit?' fit':''}${light?' light':''}" style="aspect-ratio:${ratio.toFixed(3)}">${inner}</div>`;
}
function thumbs(it){
  const P=it.page,m=it.media;const used=new Set([m.hero_image]);
  const rest=P.images.map((x,i)=>({...x,i})).filter(x=>!used.has(x.i)).slice(0,8);
  const vids=P.videos.filter(v=>v.yt&&v.yt!==m.video).slice(0,2);
  if(!rest.length&&!vids.length) return '';
  return `<div class="thumbs">${rest.map(x=>`<button class="lb-open" data-i="${x.i}"><img src="${x.uri}" alt="${(x.alt||'').replace(/"/g,'&quot;')}" loading="lazy"></button>`).join('')}${vids.map(v=>`<a href="https://www.youtube.com/watch?v=${v.yt}" target="_blank" rel="noopener" class="vt"><span>▶ YouTube</span></a>`).join('')}</div>`;
}
function post(it,showDay){
  const c=CATS[it.category]||CATS.market;
  return `${showDay?`<div class="daysep">${dayLabel(it.date)}</div>`:''}
  <article id="${it.id}" class="post ${it.importance>=5?'big':''} ${state.open.has(it.id)?'open':''}" data-id="${it.id}">
    <div class="head"><span class="src"><i>${it.tweet?'𝕏':(it.source.replace(/[^A-Za-z0-9]/g,'').slice(0,2)||'··')}</i>${it.source}</span><span>${fmtDate(it.date)}</span><span class="cat" style="--c:${c.c}">${c.n}</span><span class="imp ${it.importance>=4?'hi':''}">${it.importance}/5 · ${IMPN[it.importance]}</span></div>
    <h3 class="title">${it.title}</h3>
    ${it.tweet?tweetCard(it):media(it)}
    <p class="lead">${it.lead}</p>
    <div class="detail">
      ${it.full.map(p=>`<p class="full">${p}</p>`).join('')}
      ${thumbs(it)}
      <span class="lab">Що це означає для Luminar</span>
      <p class="means">${it.means}</p>
    </div>
    <div class="foot">${SINGLE?'':`<button class="more">${state.open.has(it.id)?'Згорнути':'Детальніше'}</button>`}<button class="copy">${COPY}Копіювати</button><a class="src-link" href="${it.url}" target="_blank" rel="noopener">Джерело ↗</a></div>
  </article>`;
}
let shown=20, filt={cat:null, hi:false};
try{filt=Object.assign(filt,JSON.parse(localStorage.getItem('lr.filt')||'{}'))}catch(_){}
function visible(){return ITEMS.filter(it=>(!filt.cat||it.category===filt.cat)&&(!filt.hi||it.importance>=4))}
function renderFilters(){
  const f=document.getElementById('filters'); if(SINGLE) return; f.hidden=false;
  const n=c=>ITEMS.filter(it=>it.category===c).length;
  f.innerHTML=`<button class="chip ${!filt.cat?'on':''}" data-cat="" title="${ITEMS.length} новин">Усе</button>`
   +Object.entries(CATS).map(([k,c])=>`<button class="chip ${filt.cat===k?'on':''}" data-cat="${k}" title="${n(k)} новин"><span class="dot" style="background:${c.c}"></span>${c.n}</button>`).join('')
   +`<button class="chip hi ${filt.hi?'on':''}" data-hi="1" title="Оцінка 4 і вище">★ Важливе</button>`;
}
function render(){
  renderFilters();
  const all=visible(), list=all.slice(0,shown);let last='';
  document.getElementById('feed').innerHTML=list.map(it=>{const d=it.date.slice(0,10);const s=d!==last;last=d;return post(it,s)}).join('')
   +(shown<all.length?`<button class="btn loadmore">Завантажити ще (${all.length-shown})</button>`:'')
   +(all.length?'':'<p class="empty">Нічого за цим фільтром.</p>');
}
document.querySelector('.brand').addEventListener('click',e=>{
  if(SINGLE) return;                    // зі сторінки поста просто йдемо на /
  e.preventDefault(); filt={cat:null,hi:false}; shown=20;
  try{localStorage.removeItem('lr.filt')}catch(_){}
  render(); window.scrollTo({top:0,behavior:'smooth'});
});
document.getElementById('filters').addEventListener('click',e=>{
  const c=e.target.closest('.chip'); if(!c) return;
  if(c.dataset.hi) filt.hi=!filt.hi; else filt.cat=c.dataset.cat||null;
  try{localStorage.setItem('lr.filt',JSON.stringify(filt))}catch(_){}
  shown=20; render(); window.scrollTo({top:0});
});
// ---- лайтбокс: усі зображення поста, ← → Esc
let lb={it:null,i:0};
function lbRender(){
  const imgs=lb.it.page.images,x=imgs[lb.i],el=document.getElementById('lb');
  el.querySelector('img').src=x.uri; el.querySelector('img').alt=x.alt||'';
  el.querySelector('.cap').textContent=x.alt||''; el.querySelector('.cnt').textContent=`${lb.i+1} / ${imgs.length}`;
  el.querySelector('.prev').disabled=lb.i===0; el.querySelector('.next').disabled=lb.i===imgs.length-1;
}
function lbOpen(it,i){
  lb={it,i}; let el=document.getElementById('lb');
  if(!el){el=document.createElement('div');el.id='lb';el.className='lb';el.setAttribute('role','dialog');el.setAttribute('aria-label','Зображення');
    el.innerHTML='<span class="cnt"></span><button class="x" aria-label="Закрити">✕</button><button class="prev" aria-label="Попереднє">‹</button><img alt=""><button class="next" aria-label="Наступне">›</button><div class="cap"></div>';
    el.addEventListener('click',e=>{const b=e.target.closest('button');if(b?.classList.contains('prev'))lbStep(-1);else if(b?.classList.contains('next'))lbStep(1);else if(b?.classList.contains('x')||e.target===el)lbClose()});
    document.body.appendChild(el)}
  el.hidden=false; document.body.style.overflow='hidden'; lbRender();
}
function lbStep(d){const n=lb.i+d;if(n<0||n>=lb.it.page.images.length)return;lb.i=n;lbRender()}
function lbClose(){const el=document.getElementById('lb');if(el)el.hidden=true;document.body.style.overflow=''}
document.addEventListener('keydown',e=>{const el=document.getElementById('lb');if(!el||el.hidden)return;
  if(e.key==='Escape')lbClose();else if(e.key==='ArrowLeft')lbStep(-1);else if(e.key==='ArrowRight')lbStep(1);else return;e.preventDefault()});
document.getElementById('feed').addEventListener('click',e=>{
  const o=e.target.closest('.lb-open');
  if(o){const it=ITEMS.find(x=>x.id===o.closest('.post').dataset.id);if(it)lbOpen(it,+o.dataset.i);return}
  if(e.target.closest('.loadmore')){shown+=20;render();return}
  const sl=e.target.closest('.copy');
  if(sl){
    const it=ITEMS.find(x=>x.id===sl.closest('.post').dataset.id); if(!it) return;
    const txt=location.origin+'/p/'+it.id;
    const done=ok=>{sl.innerHTML=COPY+(ok?'Скопійовано':'Не вдалось');setTimeout(()=>{sl.innerHTML=COPY+'Копіювати'},1800)};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>done(true),()=>done(false))}
    else{const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}ta.remove();done(ok)}
    return;
  }
  const m=e.target.closest('.more'); if(!m) return;
  const id=m.closest('.post').dataset.id;
  state.open.has(id)?state.open.delete(id):state.open.add(id); render();
});
render();
</script>
