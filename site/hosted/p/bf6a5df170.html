<style>
/* Single-theme by design: matches skylum.com (black ground, white type) */
:root{
  --bg:#000; --surface:#111214; --surface2:#1a1b1e; --line:#26272b; --line2:#3a3b40;
  --ink:#fff; --ink2:#c9ccd2; --ink3:#83868d; --text:#d6d9de;
  --accent:#f5c445; --accent-ink:#1a1200;
  --neo:#7c9cff; --mob:#5fd3a6;
  --sans:'Manrope',Roobert,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;margin:0;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
p{text-wrap:pretty}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:inherit}

.top{border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:18px 20px}
.top-in{display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none}
.back{font-size:14px;font-weight:600;color:var(--ink2);text-decoration:none}.back:hover{color:var(--ink)}

.layout{max-width:760px;margin:0 auto;padding:28px 20px 80px}
.feed{display:flex;flex-direction:column;gap:14px}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.chip{border:1px solid var(--line2);border-radius:8px;padding:6px 13px;font-size:13px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;gap:7px}
.chip.on{background:#fff;color:#000;border-color:#fff}
.chip .dot{width:7px;height:7px;border-radius:50%}
.chip .n{color:var(--ink3);font-weight:500}.chip.on .n{color:#555}
.chip.hi{margin-left:auto;border-color:var(--accent);color:var(--accent)}.chip.hi.on{background:var(--accent);color:var(--accent-ink)}
.filters{margin-bottom:14px}
.empty{color:var(--ink3);text-align:center;padding:40px 0}
@media (max-width:640px){.chip.hi{margin-left:0}}
.daysep{font-size:13px;color:var(--ink3);font-weight:600;padding:14px 0 2px;letter-spacing:.02em}

/* ---------- post ---------- */
.post{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 28px 16px;display:flex;flex-direction:column;gap:14px}
.head{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink3)}
.head .src{color:var(--ink);font-weight:600;display:flex;align-items:center;gap:8px}
.head .src i{width:20px;height:20px;border-radius:6px;background:var(--surface2);border:1px solid var(--line2);display:inline-grid;place-items:center;font-size:10px;font-weight:700;color:var(--ink2)}
.head .cat{display:inline-flex;align-items:center;gap:6px}
.head .cat::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.head .imp{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12px;padding:3px 9px;border-radius:6px;background:var(--surface2);color:var(--ink2)}
.head .imp.hi{background:var(--accent);color:var(--accent-ink)}
h3.title{font-size:24px;font-weight:700;line-height:1.22;margin:2px 0 0;letter-spacing:-.015em;text-wrap:balance;max-width:38ch}
.post.big h3.title{font-size:28px}
.lead{margin:0;color:var(--text);font-size:17px;line-height:1.6;max-width:64ch}

.tw{border:1px solid var(--line2);border-radius:14px;padding:16px 18px;background:var(--bg);display:flex;flex-direction:column;gap:12px}
.tw .who{display:flex;align-items:center;gap:10px;text-decoration:none}
.tw .who img{width:40px;height:40px;border-radius:50%;background:var(--surface2);object-fit:cover}
.tw .who b{display:block;font-size:15px;line-height:1.2}.tw .who span{font-size:13px;color:var(--ink3)}
.tw .who .x{margin-left:auto;font-weight:800;font-size:18px;color:var(--ink2)}
.tw .txt{margin:0;font-size:17px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.tw .txt a{color:var(--neo);text-decoration:none}
.tw .media{aspect-ratio:auto;max-height:520px;background:var(--surface2)}.tw .media .art{position:static;width:100%;height:auto;max-height:520px;object-fit:contain}
.tw .meta{font-size:13px;color:var(--ink3);display:flex;gap:14px;flex-wrap:wrap}
.media{position:relative;border-radius:10px;overflow:hidden;background:var(--surface2);aspect-ratio:16/9}
.media .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.media.fit{background:#0b0b0c}.media.fit .art{object-fit:contain}
.media.fit.light{background:#fff}
.vlink{position:absolute;inset:0;display:block}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal .more{position:relative}.gal .more img{position:absolute;inset:0}.gal .more::after{content:attr(data-n)}
.thumbs a{display:block;aspect-ratio:4/3;border-radius:8px;overflow:hidden;border:1px solid var(--line)}.thumbs a img{width:100%;height:100%;object-fit:cover;display:block}.thumbs a.vt{display:grid;place-items:center;background:var(--surface2);color:var(--ink2);font-size:12px;font-weight:600;text-decoration:none}
.tag{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.7);color:#fff;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:6px}
.play{position:absolute;inset:0;display:grid;place-items:center}
.play i{width:60px;height:60px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.play i::after{content:"";border-left:18px solid #000;border-top:11px solid transparent;border-bottom:11px solid transparent;margin-left:5px}
.dur{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.7);color:#fff;font-size:12px;font-weight:600;padding:3px 7px;border-radius:6px}
.gal{position:absolute;inset:0;display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:3px}
.gal > :first-child{grid-row:1/3}
.gal .more{display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px;position:relative;isolation:isolate}.gal .more img{position:absolute;inset:0;z-index:-1;filter:brightness(.5)}
.srcnote{position:absolute;right:10px;top:10px;background:rgba(0,0,0,.7);color:var(--ink2);font-size:11px;padding:4px 8px;border-radius:6px}

.foot{display:flex;align-items:center;gap:14px;padding-top:4px;border-top:1px solid var(--line);margin-top:2px}
.more{font-weight:600;font-size:14px;padding:8px 0;display:inline-flex;align-items:center;gap:8px}
.more::after{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .2s}
.post.open .more::after{transform:rotate(-135deg) translateY(-2px)}
.foot .copy{margin-left:auto;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);display:inline-flex;align-items:center;gap:7px;color:var(--ink2);font-size:13px;font-weight:600}
.foot .copy:hover{color:var(--ink);border-color:var(--ink)}
.foot .src-link{font-size:13px;color:var(--ink3);text-decoration:none}
.foot .src-link:hover{color:var(--ink)}

.detail{display:none;flex-direction:column;gap:18px;padding-top:4px}
.detail .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:-8px}
.detail .full{font-size:17px;line-height:1.7;color:var(--text);max-width:64ch}
.detail .means{font-size:17px;line-height:1.65;color:var(--ink);max-width:64ch;margin-bottom:6px;padding:14px 18px;border-left:3px solid var(--accent);background:var(--surface2);border-radius:0 10px 10px 0}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 8px}
.thumbs div{aspect-ratio:4/3;border-radius:8px;overflow:hidden;position:relative;cursor:pointer}
.thumbs div span{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;color:#fff;background:rgba(0,0,0,.35)}
.detail .lab{margin-top:6px}
.post.open .detail{display:flex}
.detail p{margin:0}

.loadmore{align-self:center;margin-top:10px}

@media (max-width:640px){
  .layout{padding:20px 12px 60px}
  .post{padding:18px 18px 12px;border-radius:14px;gap:12px}
  h3.title{font-size:21px}.post.big h3.title{font-size:23px}
  .lead,.detail .full,.detail .means{font-size:16px}
  .detail .means{padding:12px 14px}
  .head{flex-wrap:wrap;row-gap:6px}
}

</style>

<div class="top"><div class="top-in"><a class="brand" href="/">Lens Radar</a><a class="back" href="/" hidden id="back">← Вся стрічка</a></div></div>

<div class="layout">
  <div class="filters" id="filters" hidden></div>
  <main class="feed" id="feed"></main>
</div>

<script>
const CATS={comp:{n:'Конкуренти',c:'#4c7bd9'},ai:{n:'AI-моделі',c:'#b04fd0'},algo:{n:'Алгоритми',c:'#2e9b8a'},market:{n:'Ринок',c:'#c9781a'}};
document.documentElement.lang='uk';
const SINGLE=true;
const ITEMS=[{"id": "bf6a5df170", "source": "Android Authority", "url": "https://www.androidauthority.com/snapseed-android-color-grading-search-roll-out-3708328/", "date": "2026-09-07T13:25:59+00:00", "title": "Snapseed отримав інструмент Color Grade та пошук по меню інструментів", "lead": "Google випустив оновлення Snapseed 4.1.6 для Android з інструментом кольорокорекції Color Grade та пошуком по інструментах; окремо в тестуванні — новий дизайн вкладки Looks.", "full": ["Оновлення Snapseed 4.1.6 для Android додає інструмент Color Grade до стандартного списку інструментів (він же дублюється в підменю Refine) — дозволяє змінювати тони й кольори фото під конкретний художній стиль. Разом з ним з'явилася окрема панель пошуку в меню інструментів, яка допомагає швидше знаходити потрібну функцію серед великої кількості опцій, а також нова анімація завантаження замість колишніх \"очей\".", "Окремо Android Authority виявило, що команда Snapseed готує переробку вкладки Looks: замість поточних Saved і Featured планується структура з трьох розділів — My Looks (збережені/недавні/обрані пресети), Discover (готові набори, включно з колекцією Classic) та Import (пресети, імпортовані за посиланням або QR-кодом). Ця частина поки не розгорнута публічно й доступна лише як прихована функція в розробці, тож дата й факт релізу не підтверджені."], "means": "Snapseed — головний безкоштовний мобільний редактор від Google і пряма альтернатива Luminar Mobile для частини нашої аудиторії. Color Grade перетинається з нашими Color Harmony та пресетами; пошук по інструментах — практичний UX-патерн, вартий розгляду і для Luminar Neo/Mobile, де кількість AI-інструментів (Enhance AI, Sky AI, Relight AI тощо) також ускладнює навігацію.", "importance": 3, "category": "comp", "media": {"kind": "gallery", "hero_image": 0, "video": null}, "page": {"images": [{"uri": "/img/e0b0988f925e.jpg", "w": 545, "h": 1200, "alt": "Snapseed Color Grading"}, {"uri": "/img/6e4f245b506e.jpg", "w": 1000, "h": 562, "alt": ""}, {"uri": "/img/bac3ae689725.jpg", "w": 545, "h": 1200, "alt": "Snapseed Search Bar 1"}, {"uri": "/img/fbe17ef70d86.jpg", "w": 545, "h": 1200, "alt": "Snapseed Search Bar"}, {"uri": "/img/4425649fb394.jpg", "w": 545, "h": 1200, "alt": "Snapseed Updated Loading Animation"}, {"uri": "/img/669ff2dd1a89.jpg", "w": 545, "h": 1200, "alt": "Snapseed Looks Menu Current"}, {"uri": "/img/a90b952bb030.jpg", "w": 540, "h": 1200, "alt": "Snapseed Looks Menu Upcoming watermarked"}, {"uri": "/img/0c49164f3a94.jpg", "w": 540, "h": 1200, "alt": "Snapseed Looks Menu Upcoming Discover watermarked"}], "videos": []}}];
let state={open:new Set(SINGLE?ITEMS.map(x=>x.id):[])};
if(SINGLE) document.getElementById('back').hidden=false;
const IMPN=['','фон','варто знати','важливо','дуже важливо','критично'];
const MONTHS=['січ','лют','бер','кві','тра','чер','лип','сер','вер','жов','лис','гру'];
const DAYS_UK=['Неділя','Понеділок','Вівторок','Середа','Четвер','Пʼятниця','Субота'];
function fmtDate(iso){const d=new Date(iso);return `${d.getDate()} ${MONTHS[d.getMonth()]}`}
function dayLabel(iso){const d=new Date(iso),t=new Date();const diff=Math.floor((t.setHours(0,0,0,0)-new Date(d).setHours(0,0,0,0))/864e5);
  const s=`${d.getDate()} ${['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'][d.getMonth()]}`;
  return diff===0?`Сьогодні, ${s}`:diff===1?`Вчора, ${s}`:`${DAYS_UK[d.getDay()]}, ${s}`}
const COPY='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
function img(src,alt){return `<img class="art" src="${src}" alt="${(alt||'').replace(/"/g,'&quot;')}" loading="lazy">`}
function linkify(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/(https?:\/\/\S+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/(^|\s)@(\w{1,15})/g,'$1<a href="https://x.com/$2" target="_blank" rel="noopener">@$2</a>')}
function fmtN(n){return n==null?'':n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(n>=1e4?0:1)+'K':String(n)}
function tweetCard(it){
  const w=it.tweet,imgs=it.page.images,m=it.media;
  const hero=(m.hero_image!=null&&imgs[m.hero_image])?imgs[m.hero_image]:imgs[0];
  const stats=[w.views!=null?`${fmtN(w.views)} переглядів`:'',w.likes!=null?`${fmtN(w.likes)} вподобань`:'',w.reposts!=null?`${fmtN(w.reposts)} репостів`:''].filter(Boolean).join(' · ');
  return `<div class="tw">
    <a class="who" href="https://x.com/${w.handle}" target="_blank" rel="noopener">${w.avatar?`<img src="${w.avatar}" alt="" loading="lazy" onerror="this.remove()">`:'<span class="av"></span>'}<div><b>${w.name}</b><span>@${w.handle}</span></div><span class="x">𝕏</span></a>
    <p class="txt">${linkify(w.text)}</p>
    ${hero?`<div class="media">${img(hero.uri,hero.alt)}</div>`:''}
    <div class="meta"><a href="${it.url}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">${fmtDate(it.date)}</a>${stats?`<span>${stats}</span>`:''}</div>
  </div>`;
}
function media(it){
  const m=it.media,P=it.page,imgs=P.images;let inner='',kind='';
  const hero=(m.hero_image!=null&&imgs[m.hero_image])?imgs[m.hero_image]:imgs[0];
  if(m.kind==='video'&&m.video){
    const poster=hero?img(hero.uri):`<div class="art" style="background:#1a1b1e"></div>`;
    inner=`<a class="vlink" href="https://www.youtube.com/watch?v=${m.video}" target="_blank" rel="noopener">${poster}<div class="play"><i></i></div></a>`;kind='Відео';
  }else if(m.kind==='gallery'&&imgs.length>=3){
    const rest=imgs.filter(x=>x!==hero).slice(0,2);
    inner=`<div class="gal">${img(hero.uri)}${img(rest[0].uri)}<div class="more">${imgs.length>3?`+${imgs.length-3}`:''}${img(rest[1].uri)}</div></div>`;kind='Галерея';
  }else if(hero){inner=img(hero.uri,hero.alt)+(hero.generated?'<span class="srcnote">ілюстрація AI</span>':'');kind='Зображення'}
  else return '';
  // короб під пропорції картинки: нічого не ріжемо; дуже вертикальні/панорамні — вписуємо цілком
  let ratio=hero?hero.w/hero.h:16/9, fit=false;
  if(kind==='Галерея'||kind==='Відео') ratio=16/9;
  else if(ratio<0.9){ratio=0.9;fit=true} else if(ratio>2.2){ratio=2.2;fit=true}
  const light=/^arXiv/.test(it.source)&&kind==='Зображення'; if(light) fit=true;
  return `<div class="media${fit?' fit':''}${light?' light':''}" style="aspect-ratio:${ratio.toFixed(3)}">${inner}</div>`;
}
function thumbs(it){
  const P=it.page,m=it.media;const used=new Set([m.hero_image]);
  const rest=P.images.map((x,i)=>({...x,i})).filter(x=>!used.has(x.i)).slice(0,4);
  const vids=P.videos.filter(v=>v.yt&&v.yt!==m.video).slice(0,2);
  if(!rest.length&&!vids.length) return '';
  return `<div class="thumbs">${rest.map(x=>`<a href="${x.uri}" target="_blank" rel="noopener"><img src="${x.uri}" alt="${(x.alt||'').replace(/"/g,'&quot;')}" loading="lazy"></a>`).join('')}${vids.map(v=>`<a href="https://www.youtube.com/watch?v=${v.yt}" target="_blank" rel="noopener" class="vt"><span>▶ YouTube</span></a>`).join('')}</div>`;
}
function post(it,showDay){
  const c=CATS[it.category]||CATS.market;
  return `${showDay?`<div class="daysep">${dayLabel(it.date)}</div>`:''}
  <article id="${it.id}" class="post ${it.importance>=5?'big':''} ${state.open.has(it.id)?'open':''}" data-id="${it.id}">
    <div class="head"><span class="src"><i>${it.tweet?'𝕏':(it.source.replace(/[^A-Za-z0-9]/g,'').slice(0,2)||'··')}</i>${it.source}</span><span>${fmtDate(it.date)}</span><span class="cat" style="--c:${c.c}">${c.n}</span><span class="imp ${it.importance>=4?'hi':''}">${it.importance}/5 · ${IMPN[it.importance]}</span></div>
    <h3 class="title">${it.title}</h3>
    ${it.tweet?tweetCard(it):media(it)}
    <p class="lead">${it.lead}</p>
    <div class="detail">
      ${it.full.map(p=>`<p class="full">${p}</p>`).join('')}
      ${thumbs(it)}
      <span class="lab">Що це означає для Luminar</span>
      <p class="means">${it.means}</p>
    </div>
    <div class="foot">${SINGLE?'':`<button class="more">${state.open.has(it.id)?'Згорнути':'Детальніше'}</button>`}<button class="copy">${COPY}Копіювати</button><a class="src-link" href="${it.url}" target="_blank" rel="noopener">Джерело ↗</a></div>
  </article>`;
}
let shown=20, filt={cat:null, hi:false};
try{filt=Object.assign(filt,JSON.parse(localStorage.getItem('lr.filt')||'{}'))}catch(_){}
function visible(){return ITEMS.filter(it=>(!filt.cat||it.category===filt.cat)&&(!filt.hi||it.importance>=4))}
function renderFilters(){
  const f=document.getElementById('filters'); if(SINGLE) return; f.hidden=false;
  const n=c=>ITEMS.filter(it=>it.category===c).length;
  f.innerHTML=`<button class="chip ${!filt.cat?'on':''}" data-cat="">Усе <span class="n">${ITEMS.length}</span></button>`
   +Object.entries(CATS).map(([k,c])=>`<button class="chip ${filt.cat===k?'on':''}" data-cat="${k}"><span class="dot" style="background:${c.c}"></span>${c.n} <span class="n">${n(k)}</span></button>`).join('')
   +`<button class="chip hi ${filt.hi?'on':''}" data-hi="1">★ Тільки важливе</button>`;
}
function render(){
  renderFilters();
  const all=visible(), list=all.slice(0,shown);let last='';
  document.getElementById('feed').innerHTML=list.map(it=>{const d=it.date.slice(0,10);const s=d!==last;last=d;return post(it,s)}).join('')
   +(shown<all.length?`<button class="btn loadmore">Завантажити ще (${all.length-shown})</button>`:'')
   +(all.length?'':'<p class="empty">Нічого за цим фільтром.</p>');
}
document.getElementById('filters').addEventListener('click',e=>{
  const c=e.target.closest('.chip'); if(!c) return;
  if(c.dataset.hi) filt.hi=!filt.hi; else filt.cat=c.dataset.cat||null;
  try{localStorage.setItem('lr.filt',JSON.stringify(filt))}catch(_){}
  shown=20; render(); window.scrollTo({top:0});
});
document.getElementById('feed').addEventListener('click',e=>{
  if(e.target.closest('.loadmore')){shown+=20;render();return}
  const sl=e.target.closest('.copy');
  if(sl){
    const it=ITEMS.find(x=>x.id===sl.closest('.post').dataset.id); if(!it) return;
    const txt=location.origin+'/p/'+it.id;
    const done=ok=>{sl.innerHTML=COPY+(ok?'Скопійовано':'Не вдалось');setTimeout(()=>{sl.innerHTML=COPY+'Копіювати'},1800)};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>done(true),()=>done(false))}
    else{const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}ta.remove();done(ok)}
    return;
  }
  const m=e.target.closest('.more'); if(!m) return;
  const id=m.closest('.post').dataset.id;
  state.open.has(id)?state.open.delete(id):state.open.add(id); render();
});
render();
</script>
